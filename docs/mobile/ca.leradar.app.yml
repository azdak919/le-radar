Builds:
  - versionName: 1.0.0
    versionCode: 1
    commit: 81774e4ab824c8c8a03afa106e81459c661c7d1a
    subdir: android/app
    sudo:
      - echo "deb https://deb.debian.org/debian forky main" > /etc/apt/sources.list.d/forky.list
      - apt-get update
      - apt-get install -y -t forky nodejs npm
    init:
      - cd ../..
      - npm ci
      - npm run mobile:sync
    gradle:
      - yes
    output: build/outputs/apk/release/app-release-unsigned.apk
    scandelete:
      - node_modules
