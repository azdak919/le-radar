<!DOCTYPE html>
<html lang="fr-CA">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#0e0f12">
  <meta name="robots" content="noindex">
  <title>LE-RADAR</title>
  <link rel="icon" href="./icons/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./css/app.css">
  <link rel="stylesheet" href="./css/translate-menu.css">
</head>
<body>
  <a class="skip" href="#screen">Aller au contenu</a>
  <div class="shell">
    <header class="top">
      <div class="top-bar">
        <a class="brand" href="#/accueil">
          <img src="./icons/icon.svg" alt="" width="28" height="28">
          <span class="notranslate" translate="no">LE-RADAR.ca</span>
        </a>
        <div class="translate-control notranslate" id="translate-control" translate="no">
          <button
            type="button"
            id="translate-toggle"
            class="translate-toggle"
            aria-haspopup="dialog"
            aria-expanded="false"
            aria-controls="translate-menu"
            data-mode="original"
            title="Ne pas traduire — articles dans leur langue d’origine"
          >
            <span class="translate-toggle__icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor" aria-hidden="true">
                <path d="M12.87 15.07l-2.54-2.51.03-.03A17.52 17.52 0 0 0 14.07 6H17V4h-7V2H8v2H1v2h11.17C11.5 7.92 10.44 9.75 9 11.35 8.07 10.32 7.3 9.19 6.69 8h-2c.73 1.63 1.73 3.17 2.98 4.56l-5.09 5.02L4 19l5-5 3.11 3.11.76-2.04zM18.5 10h-2L12 22h2l1.12-3h4.75L21 22h2l-4.5-12zm-2.62 7 1.62-4.33L19.12 17h-3.24z"/>
              </svg>
            </span>
            <span id="translate-label" class="translate-toggle__label">Original</span>
            <svg class="translate-toggle__chev" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
          </button>
          <div id="translate-menu" class="translate-menu" role="dialog" aria-modal="false" aria-label="Langue d'affichage" hidden></div>
        </div>
      </div>
      <p class="tagline">
        <span class="tagline-lead">Journaux, radios et sports étudiants du Québec,</span>
        <span class="tagline-tag">réunis au même endroit</span>
      </p>
    </header>
    <div id="net" role="status"></div>
    <main id="screen" tabindex="-1">
      <p class="loading">Chargement du fil…</p>
    </main>
  </div>
  <section class="player" id="player" aria-label="Radio en cours" data-state="idle" hidden>
    <audio id="player-audio" preload="none"></audio>
    <a class="player-info" id="player-info" href="#/explorer?section=radios">
      <span class="player-live" aria-hidden="true"></span>
      <span class="player-text">
        <span class="player-name notranslate" id="player-name"></span>
        <span class="player-now notranslate" id="player-now"></span>
      </span>
    </a>
    <button type="button" class="player-btn player-toggle" id="player-toggle" data-action="player-toggle" aria-label="Écouter">
      <svg class="icon-play" viewBox="0 0 24 24" aria-hidden="true" fill="currentColor"><path d="M8 5.5v13a.6.6 0 0 0 .9.5l10.2-6.5a.6.6 0 0 0 0-1L8.9 5a.6.6 0 0 0-.9.5z"/></svg>
      <svg class="icon-pause" viewBox="0 0 24 24" aria-hidden="true" fill="currentColor"><rect x="6.5" y="5" width="4" height="14" rx="1"/><rect x="13.5" y="5" width="4" height="14" rx="1"/></svg>
    </button>
    <button type="button" class="player-btn player-stop" data-action="player-stop" aria-label="Arrêter la radio">
      <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="m7 7 10 10M17 7 7 17"/></svg>
    </button>
  </section>
  <nav class="tabs" id="tabs" aria-label="Sections de l’application">
    <a href="#/accueil" data-tab="accueil">
      <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 10.5 12 4l8 6.5V20a1 1 0 0 1-1 1h-5v-6H10v6H5a1 1 0 0 1-1-1z"/></svg>
      <span>Accueil</span>
    </a>
    <a href="#/explorer" data-tab="explorer">
      <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="8"/><path d="m14.5 14.5-2-4-4 2z"/></svg>
      <span>Explorer</span>
    </a>
    <a href="#/recherche" data-tab="recherche">
      <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="11" cy="11" r="6"/><path d="m20 20-3.5-3.5"/></svg>
      <span>Recherche</span>
    </a>
    <a href="#/enregistres" data-tab="enregistres">
      <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M7 4h10a1 1 0 0 1 1 1v15l-6-3-6 3V5a1 1 0 0 1 1-1z"/></svg>
      <span>Enregistrés</span>
    </a>
    <a href="#/reglages" data-tab="reglages">
      <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3"/><path d="M12 3v2m0 14v2M3 12h2m14 0h2M5.6 5.6l1.4 1.4m10 10 1.4 1.4m0-12.8-1.4 1.4m-10 10-1.4 1.4"/></svg>
      <span>Réglages</span>
    </a>
  </nav>
  <p id="status" class="sr-only" role="status"></p>
  <script>
    (function () {
      var inSourceTree = /\/mobile\/app\/?/.test(location.pathname);
      var root = inSourceTree ? '../../' : './data/';
      window.RADAR_TRANSLATE_ASSETS = {
        'indigenous-mt.json': new URL(root + 'indigenous-mt.json', location.href).href,
        'news-sources.json': new URL(root + 'news-sources.json', location.href).href,
      };
    }());
  </script>
  <script defer src="./js/core.js"></script>
  <script defer src="./js/boot.js"></script>
  <script defer src="./js/app.js"></script>
  <script defer src="./js/translate.js"></script>
</body>
</html>
