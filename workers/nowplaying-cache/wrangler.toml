name = "le-radar-nowplaying"
main = "src/index.js"
compatibility_date = "2026-07-23"
workers_dev = true
preview_urls = false

# Workers Logs: the dashboard toggle is overwritten unless it lives here.
# Traces off — invocation + console logs are enough at this volume.
[observability]
enabled = true
head_sampling_rate = 1

[observability.logs]
enabled = true
invocation_logs = true
persist = true

[observability.traces]
enabled = false
