<!doctype html>
<html lang="fr-CA">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Labo affiches 11×17 — LE-RADAR (local)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      color-scheme: dark;
      --bg: #0E0F12;
      --panel: #16181E;
      --line: #26282D;
      --ink: #F1F2F4;
      --soft: #C2C6CD;
      --muted: #888D96;
      --purple: #6C2163;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.45 Inter, ui-sans-serif, system-ui, sans-serif; }
    #gate { padding: 4rem 1.5rem; text-align: center; color: var(--muted); }
    .bar {
      position: sticky; top: 0; z-index: 4;
      display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px;
      padding: 12px 20px;
      background: color-mix(in srgb, var(--bg) 92%, transparent);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--line);
    }
    .bar .mark { display: flex; align-items: center; gap: 10px; }
    .bar .mark img { width: 28px; height: 28px; border-radius: 6px; }
    h1 { margin: 0; font: 700 1.15rem/1.1 "Source Serif 4", Georgia, serif; }
    .bar a { color: var(--soft); text-decoration: none; font-size: 13px; }
    .bar a:hover { color: var(--ink); }
    .filters { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
    .modes { display: flex; gap: 6px; margin-left: auto; }
    .modes button, .nav button, .filters button {
      appearance: none; cursor: pointer;
      border: 1px solid var(--line); background: var(--panel); color: var(--soft);
      font: 600 12px/1 Inter, sans-serif; padding: 6px 11px; border-radius: 999px;
    }
    .modes button.is-on, .filters button.is-on { border-color: var(--purple); color: var(--ink); background: color-mix(in srgb, var(--purple) 22%, var(--bg)); }
    .hint { color: var(--muted); font-size: 12px; }
    .wall {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 28px 22px;
      padding: 28px 22px 64px;
      max-width: 1480px;
      margin: 0 auto;
    }
    .poster {
      margin: 0; cursor: pointer; background: transparent; border: 0; padding: 0;
      color: inherit; text-align: left; width: 100%; font: inherit;
    }
    .poster img {
      width: 100%; height: auto; aspect-ratio: 11 / 17; object-fit: cover;
      display: block; border-radius: 2px;
      box-shadow: 0 18px 40px #0008, 0 0 0 1px #ffffff10;
    }
    .poster .cap {
      display: block; margin: 10px 2px 0;
      font-size: 12px; color: var(--soft);
    }
    .poster .cap strong { display: block; color: var(--ink); font-size: 13.5px; font-weight: 600; }
    .stage {
      display: none;
      min-height: calc(100vh - 58px);
      padding: 24px 16px 48px;
      justify-content: center;
    }
    body.mode-stage .wall { display: none; }
    body.mode-stage .stage { display: flex; flex-direction: column; align-items: center; gap: 16px; }
    .stage-frame {
      width: min(11in, calc(100vw - 32px));
      box-shadow: 0 24px 70px #000a;
    }
    .stage-frame img { width: 100%; height: auto; display: block; aspect-ratio: 11 / 17; }
    .stage-meta { color: var(--muted); font-size: 13px; text-align: center; }
    .stage-meta strong { color: var(--ink); }
    .stage-meta a { color: var(--soft); }
    .nav { display: flex; gap: 8px; }
  </style>
</head>
<body>
  <div id="gate" hidden>
    <p>Ce labo n’existe qu’en <strong>local</strong> (127.0.0.1).</p>
  </div>
  <div id="lab" hidden>
    <header class="bar">
      <div class="mark">
        <img src="../assets/icon.svg" width="28" height="28" alt="">
        <div>
          <h1>Affiches 11×17</h1>
          <div class="hint">Sans barre · wordmark logo à gauche · 11×17 · 300 dpi</div>
        </div>
      </div>
      <a href="./">← Labo</a>
      <div class="filters" role="tablist" aria-label="Fond">
        <button type="button" data-ground="nophoto" class="is-on">Sans photo</button>
        <button type="button" data-ground="photo">Avec photo</button>
      </div>
      <div class="filters" role="tablist" aria-label="Variante">
        <button type="button" data-kind="standard">Français</button>
        <button type="button" data-kind="minimal">Minimal</button>
        <button type="button" data-kind="bilingue" class="is-on">Bilingue</button>
        <button type="button" id="toggle-qr">Zone QR</button>
      </div>
      <div class="modes" role="tablist" aria-label="Vue">
        <button type="button" id="mode-wall" class="is-on">Mur</button>
        <button type="button" id="mode-stage">Épreuve</button>
      </div>
    </header>
    <section class="wall" id="wall" aria-label="Mur d’affiches"></section>
    <section class="stage" id="stage" aria-label="Épreuve 11 pouces">
      <div class="nav">
        <button type="button" id="prev">←</button>
        <button type="button" id="next">→</button>
      </div>
      <figure class="stage-frame">
        <img id="stage-img" alt="">
      </figure>
      <p class="stage-meta" id="stage-meta"></p>
      <p class="stage-meta" id="stage-qr-link" hidden><a href="https://le-radar.ca" target="_blank" rel="noopener">Tester le QR → le-radar.ca</a></p>
    </section>
  </div>
  <script>
    const CAMPUSES = [
      { slug: "generique", name: "Générique", grounds: [{ key: "nophoto", place: "Fond uni" }] },
      { slug: "laval", name: "Université Laval", grounds: [
        { key: "nophoto", place: "Fond uni" },
        { key: "pouliot", place: "Adrien-Pouliot" },
        { key: "parc", place: "Campus central" },
        { key: "dkn", place: "Charles-De Koninck" },
        { key: "grandaxe", place: "Grand Axe" },
        { key: "casault", place: "Louis-Jacques-Casault" },
        { key: "palasis", place: "Palasis-Prince" },
        { key: "bonenfant", place: "Jean-Charles-Bonenfant" },
      ]},
      { slug: "mcgill", name: "Université McGill", grounds: [
        { key: "nophoto", place: "Fond uni" },
        { key: "arts", place: "Arts Building" },
        { key: "pelouse", place: "Pelouse du campus" },
        { key: "roddick", place: "Roddick Gates" },
        { key: "downtown", place: "Campus downtown" },
      ]},
      { slug: "udem", name: "Université de Montréal", grounds: [
        { key: "nophoto", place: "Fond uni" },
        { key: "gaudry", place: "Roger-Gaudry" },
        { key: "facade", place: "Façade Gaudry" },
      ]},
      { slug: "uqam", name: "Université du Québec à Montréal", grounds: [
        { key: "nophoto", place: "Fond uni" },
        { key: "jasmin", place: "Judith-Jasmin" },
        { key: "agora", place: "Agora Judith-Jasmin" },
      ]},
      { slug: "concordia", name: "Université Concordia", grounds: [
        { key: "nophoto", place: "Fond uni" },
        { key: "hall", place: "Henry F. Hall" },
        { key: "loyola", place: "Campus Loyola" },
        { key: "sgw", place: "Sir George Williams" },
      ]},
      { slug: "sherbrooke", name: "Université de Sherbrooke", grounds: [
        { key: "nophoto", place: "Fond uni" },
        { key: "longueuil", place: "Longueuil" },
        { key: "cabana", place: "Georges-Cabana" },
      ]},
      { slug: "bishops", name: "Université Bishop’s", grounds: [
        { key: "nophoto", place: "Fond uni" },
        { key: "brick", place: "Bâtiment principal" },
        { key: "quad", place: "Campus Lennoxville" },
        { key: "mcgreer", place: "McGreer Hall" },
        { key: "chapelle", place: "Chapelle" },
      ]},
    ];
    const KIND_LABEL = { standard: "Standard", minimal: "Minimal", bilingue: "Bilingue" };

    const local = ["127.0.0.1", "localhost", "[::1]"].includes(location.hostname);
    if (!local) {
      document.getElementById("gate").hidden = false;
    } else {
      document.getElementById("lab").hidden = false;
    }

    let kind = "bilingue";
    let withQr = false;
    let groundMode = "nophoto";
    let index = 0;
    const wall = document.getElementById("wall");
    const stageImg = document.getElementById("stage-img");
    const stageMeta = document.getElementById("stage-meta");

    function variantKey() {
      return withQr ? `${kind}-qr` : kind;
    }
    function items() {
      const list = [];
      CAMPUSES.forEach((c) => {
        c.grounds.forEach((g) => {
          const isPhoto = g.key !== "nophoto";
          if (groundMode === "nophoto" && isPhoto) return;
          if (groundMode === "photo" && !isPhoto) return;
          list.push({ slug: c.slug, name: c.name, ground: g.key, place: g.place });
        });
      });
      return list;
    }
    function fileStem(it) {
      return `affiche-${it.slug}-${it.ground}-${variantKey()}`;
    }
    function previewSrc(it) {
      return `../assets/kit/affiches/${fileStem(it)}-preview.jpg`;
    }
    function fullSrc(it) {
      return `../assets/kit/affiches/${fileStem(it)}.jpg`;
    }

    function renderWall() {
      wall.innerHTML = "";
      items().forEach((p, i) => {
        const btn = document.createElement("button");
        btn.className = "poster";
        btn.type = "button";
        const v = KIND_LABEL[kind] + (withQr ? " + zone QR" : "");
        btn.innerHTML = `<img src="${previewSrc(p)}" width="792" height="1224" alt="Affiche ${p.name}"><span class="cap"><strong>${p.name}</strong>${p.place} · ${v}</span>`;
        btn.addEventListener("click", () => openStage(i));
        wall.appendChild(btn);
      });
    }

    function renderStage() {
      const list = items();
      if (!list.length) return;
      index = Math.min(index, list.length - 1);
      const p = list[index];
      const v = KIND_LABEL[kind] + (withQr ? " + zone QR" : "");
      stageImg.onerror = () => { stageImg.src = previewSrc(p); };
      stageImg.src = fullSrc(p);
      stageImg.alt = `Affiche ${p.name}`;
      stageMeta.innerHTML = `<strong>${p.name}</strong> · ${v} · ${p.place}`;
      const qrLink = document.getElementById("stage-qr-link");
      qrLink.hidden = !withQr;
    }

    function openStage(i) {
      index = i;
      document.body.classList.add("mode-stage");
      document.getElementById("mode-wall").classList.remove("is-on");
      document.getElementById("mode-stage").classList.add("is-on");
      renderStage();
    }

    function openWall() {
      document.body.classList.remove("mode-stage");
      document.getElementById("mode-stage").classList.remove("is-on");
      document.getElementById("mode-wall").classList.add("is-on");
    }

    document.getElementById("mode-wall").addEventListener("click", openWall);
    document.getElementById("mode-stage").addEventListener("click", () => openStage(index));
    document.getElementById("prev").addEventListener("click", () => {
      const n = items().length;
      index = (index + n - 1) % n;
      renderStage();
    });
    document.getElementById("next").addEventListener("click", () => {
      const n = items().length;
      index = (index + 1) % n;
      renderStage();
    });
    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape") openWall();
      if (e.key === "ArrowLeft") document.getElementById("prev").click();
      if (e.key === "ArrowRight") document.getElementById("next").click();
    });

    document.querySelectorAll(".filters [data-kind]").forEach((btn) => {
      btn.addEventListener("click", () => {
        kind = btn.getAttribute("data-kind");
        document.querySelectorAll(".filters [data-kind]").forEach((b) => b.classList.toggle("is-on", b === btn));
        renderWall();
        if (document.body.classList.contains("mode-stage")) renderStage();
      });
    });
    document.getElementById("toggle-qr").addEventListener("click", () => {
      withQr = !withQr;
      document.getElementById("toggle-qr").classList.toggle("is-on", withQr);
      renderWall();
      if (document.body.classList.contains("mode-stage")) renderStage();
    });
    document.querySelectorAll(".filters [data-ground]").forEach((btn) => {
      btn.addEventListener("click", () => {
        groundMode = btn.getAttribute("data-ground");
        document.querySelectorAll(".filters [data-ground]").forEach((b) => b.classList.toggle("is-on", b === btn));
        index = 0;
        renderWall();
        if (document.body.classList.contains("mode-stage")) renderStage();
      });
    });

    renderWall();
  </script>
</body>
</html>
