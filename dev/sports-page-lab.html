  <style>
    /*
     * Établi du labo. Les cartes = CSS prod (seo-pages.css).
     * .sports-result--live = proposition, pas encore émis par seo-pages.js.
     */
    html.lab-app, html.lab-app body {
      height: 100%;
      max-width: none;
      overflow: hidden;
    }
    body.lab-app {
      display: grid;
      grid-template-columns: 220px minmax(0, 1fr);
      grid-template-rows: auto minmax(0, 1fr);
      margin: 0;
    }
    .lab-chrome {
      grid-column: 1 / -1;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px 14px;
      padding: 8px 12px;
      border-bottom: 1px solid var(--rule);
      background: var(--bg);
    }
    .lab-chrome h1 {
      margin: 0;
      font: 700 1.05rem/1.2 var(--serif);
      color: var(--ink);
      letter-spacing: -0.02em;
      white-space: nowrap;
    }
    .lab-chrome .lab-links {
      margin: 0;
      font: 500 12px/1.2 var(--sans);
    }
    .lab-chrome a { color: var(--accent); }
    .lab-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 5px 6px;
      align-items: center;
    }
    .lab-bar span.k {
      font: 800 10px/1 var(--sans);
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--muted);
      margin: 0 2px 0 8px;
    }
    .lab-bar button {
      appearance: none;
      border: 1px solid var(--rule);
      background: var(--bg-soft);
      color: var(--ink-soft);
      font: 600 12px/1.2 var(--sans);
      padding: 5px 9px;
      border-radius: 999px;
      cursor: pointer;
    }
    .lab-bar button.is-on {
      border-color: color-mix(in srgb, var(--accent) 55%, var(--rule));
      background: color-mix(in srgb, var(--accent) 12%, var(--bg));
      color: var(--accent);
    }
    #lab-nav {
      overflow: auto;
      border-right: 1px solid var(--rule);
      background: var(--bg-soft);
      padding: 8px 0 24px;
    }
    #lab-nav p {
      margin: 8px 12px 6px;
      font: 800 10px/1 var(--sans);
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--muted);
    }
    #lab-nav a {
      display: block;
      padding: 6px 12px;
      font: 600 12.5px/1.3 var(--sans);
      color: var(--ink-soft);
      text-decoration: none;
      border-left: 3px solid transparent;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    #lab-nav a:hover { color: var(--ink); background: color-mix(in srgb, var(--ink) 5%, transparent); }
    #lab-nav a.is-on {
      color: var(--ink);
      border-left-color: var(--accent);
      background: color-mix(in srgb, var(--accent) 10%, transparent);
    }
    #lab-main {
      overflow: auto;
      min-width: 0;
      padding: 16px 18px 40px;
      background: var(--bg);
    }
    #stage { --lab-w: 390px; }
    #fiches {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(min(100%, var(--lab-w)), var(--lab-w)));
      gap: 18px 16px;
      align-items: start;
    }
    body.lab-full #fiches {
      grid-template-columns: repeat(auto-fill, minmax(min(100%, 288px), 1fr));
    }
    .lab-case {
      min-width: 0;
      scroll-margin-top: 12px;
    }
    .lab-case > p {
      margin: 0 0 8px;
      font: 600 12px/1.35 var(--sans);
      color: var(--ink-soft);
    }
    .lab-case > p strong { color: var(--ink); }
    .lab-case > p em {
      font-style: normal;
      color: var(--muted);
      font-weight: 500;
    }
    .lab-case.is-on .sports-panel {
      outline: 2px solid color-mix(in srgb, var(--accent) 70%, var(--rule));
      outline-offset: 2px;
    }
    #formats {
      margin: 28px 0 0;
      border-top: 1px solid var(--rule);
      padding-top: 12px;
    }
    #formats > summary {
      cursor: pointer;
      font: 700 13px/1.3 var(--sans);
      color: var(--ink-soft);
    }
    .lab-frame { margin: 14px 0 0; }
    .lab-frame p {
      margin: 0 0 6px;
      font: 600 12px/1.3 var(--sans);
      color: var(--muted);
    }
    .lab-frame iframe {
      display: block;
      border: 1px solid var(--rule);
      border-radius: 10px;
      background: var(--bg);
      height: 520px;
    }
    html.lab-embed, html.lab-embed body {
      height: auto;
      overflow: auto;
      display: block;
      background: var(--bg);
    }
    html.lab-embed .lab-chrome,
    html.lab-embed #lab-nav,
    html.lab-embed #lab-filters,
    html.lab-embed #formats,
    html.lab-embed .lab-case > p,
    html.lab-embed #fiches {
      display: none !important;
    }
    html.lab-embed #lab-main { overflow: visible; padding: 12px; }
    html.lab-embed #stage { margin: 0; }
    #fiches[hidden],
    #grille[hidden] {
      display: none !important;
    }
    @media (max-width: 720px) {
      body.lab-app {
        grid-template-columns: 1fr;
        grid-template-rows: auto auto minmax(0, 1fr);
      }
      #lab-nav {
        border-right: 0;
        border-bottom: 1px solid var(--rule);
        max-height: 28vh;
      }
    }

    #lab-filters {
      position: sticky;
      top: 0;
      z-index: 2;
      margin: 0 0 16px;
      padding: 0 0 10px;
      background: var(--bg);
    }
    .lab-case[hidden],
    #grille .sports-panel[hidden] { display: none !important; }
  </style>
</head>

  <script>
    const TONE = {
      hockey: '#0b3d91', football: '#6b4f2a', soccer: '#1a7a4c',
      basketball: '#c45c26', volleyball: '#6c2163', sailing: '#0e7490',
      rugby: '#7c2d12', ultimate: '#7c3aed',
    };
    const GLYPH = {
      hockey: '🏒', football: '🏈', soccer: '⚽', basketball: '🏀',
      volleyball: '🏐', sailing: '⛵', rugby: '🏉', ultimate: '🥏',
    };

    function resultRow(r) {
      const kind = r.kind; // next | W | L | D | live | place
      const prior = r.prior ? ' sports-result--prior-season' : '';
      const cls = `sports-result sports-result--${kind}${prior}`;
      const data = kind === 'next' || kind === 'live'
        ? ''
        : ` data-result="${kind}"${r.prior ? ' data-prior-season="1"' : ''}`;
      const time = r.clock
        ? `<time class="sports-result__time" datetime="${r.date}"><span class="sports-result__day">${r.day}</span><span class="sports-result__clock">${r.clock}</span></time>`
        : `<time class="sports-result__time" datetime="${r.date}">${r.day}</time>`;
      let scoreCls = 'sports-result__score';
      let score = r.score;
      let scoreAria = r.scoreAria || '';
      if (kind === 'next') {
        scoreCls += ' sports-result__score--next';
        score = 'À venir';
        scoreAria = 'À venir';
      } else if (kind === 'live') {
        if (r.score) {
          score = r.score;
          scoreAria = r.scoreAria || 'En cours';
        } else {
          scoreCls += ' sports-result__score--live';
          score = 'En cours';
          scoreAria = 'En cours';
        }
      }
      const vs = r.vs || 'vs';
      const school = r.oppSchool
        ? ` <span class="sports-result__opp-school">${r.oppSchool}</span>`
        : '';
      const full = r.oppFull
        ? `<span class="sports-result__opp-full">${r.oppFull}</span>`
        : '';
      const venue = r.venue
        ? `<span class="sports-result__venue">${r.venue}</span>`
        : '';
      const inner = `<span class="sports-result__vs">${vs}</span> <span class="sports-result__opp">${r.opp}</span>${school}${full}${venue}`;
      const title = r.href
        ? `<a href="${r.href}" target="_blank" rel="noopener noreferrer" title="${r.opp} — Ouvrir la source officielle">${inner}</a>`
        : inner;
      const badgeMod = r.badgeMod ? ` sports-result__badge--${r.badgeMod}` : '';
      const badge = kind === 'next'
        ? `<span class="sports-result__badge sports-result__badge--next" title="À venir">→</span>`
        : kind === 'live'
          ? `<span class="sports-result__badge" title="En cours"></span>`
          : `<span class="sports-result__badge${badgeMod}" title="${r.badgeTitle || ''}">${r.badge || ''}</span>`;
      const priorMeta = r.prior
        ? `\n  <span class="sports-result__season-meta">Saison précédente</span>`
        : '';
      return `<li class="${cls}"${data}>
  ${time}
  <span class="${scoreCls}" aria-label="${scoreAria}">${score}</span>
  <span class="sports-result__title">${title}</span>
  ${badge}${priorMeta}
</li>`;
    }

    function panel(p) {
      const tone = TONE[p.sport] || 'var(--accent)';
      const glyph = GLYPH[p.sport] || '🏅';
      const sexMod = p.sexKey === 'F' ? 'f' : p.sexKey === 'M' ? 'm' : 'x';
      const isLive = !!(p.live || (p.rows || []).some((r) => r.kind === 'live'));
      const sexBadge = p.sex
        ? ` <span class="sports-panel__sex sports-panel__sex--${sexMod}"${p.sexKey === 'X' ? ' title="Mixte"' : ''}>${p.sex}</span>`
        : '';
      const livePill = isLive ? ' <span class="sports-panel__live">En cours</span>' : '';
      const code = p.code
        ? ` <span class="sports-panel__code notranslate" translate="no">${p.code}</span>`
        : '';
      let nameBlock;
      if (p.nick) {
        nameBlock = `<h3 class="sports-panel__name sports-panel__name--branded"><span class="sports-panel__brand">${p.nick}</span>${sexBadge}${livePill}</h3>
      <p class="sports-panel__program"><span class="sports-panel__name-text">${p.name}</span>${code}</p>`;
      } else {
        nameBlock = `<h3 class="sports-panel__name"><span class="sports-panel__brand">${p.name}</span>${code}${sexBadge}${livePill}</h3>`;
      }
      const school = p.school
        ? `<p class="sports-panel__school">${p.school}</p>`
        : '';
      const extra = [
        p.external ? 'sports-panel--external' : '',
        p.spotlight ? 'is-spotlight' : '',
        isLive ? 'sports-panel--live' : '',
      ].filter(Boolean).join(' ');
      let body;
      if (p.emptyClub) {
        body = `<p class="sports-panel__empty sports-panel__empty--club">${p.emptyClub}</p>`;
      } else if (p.empty) {
        body = `<p class="sports-panel__empty">${p.empty}</p>`;
      } else if (p.externalLinks) {
        const list = p.externalLinks.map((l) => `<li class="sports-result sports-result--next">
  <span class="sports-result__time" aria-hidden="true">${glyph}</span>
  <span class="sports-result__score sports-result__score--next">Ouvrir le site officiel</span>
  <span class="sports-result__title"><a href="${l.href}" target="_blank" rel="noopener noreferrer">${l.label}</a></span>
  <span class="sports-result__badge sports-result__badge--next" aria-hidden="true">→</span>
</li>`).join('\n');
        body = `<ul class="sports-panel__list">\n${list}\n  </ul>`;
      } else {
        body = `<ul class="sports-panel__list">${(p.rows || []).map(resultRow).join('\n')}</ul>`;
      }
      return `<section class="sports-panel${extra ? ` ${extra}` : ''}" data-sport="${p.sport}" data-sector="${p.sector || ''}" data-sex="${(p.sexKey || '').toLowerCase()}"${isLive ? ' data-live="1"' : ''} style="--sports-panel-c:${tone}">
  <header class="sports-panel__head">
    <span class="sports-panel__glyph" aria-hidden="true">${glyph}</span>
    <div class="sports-panel__identity">
      ${nameBlock}
      ${school}
      <p class="sports-panel__meta">${p.meta}</p>
    </div>
  </header>
  ${body}
</section>`;
    }

    const params = new URLSearchParams(location.search);
    const embed = params.get('embed') === '1';
    const fiches = document.getElementById('fiches');
    const grille = document.getElementById('grille');
    const nav = document.getElementById('lab-nav');

    if (embed) {
      document.documentElement.classList.remove('lab-app');
      document.documentElement.classList.add('lab-embed');
      document.body.classList.remove('lab-app');
    }

    fiches.innerHTML = cases.map((c, i) => {
      const note = c.note ? ` <em>— ${c.note}</em>` : '';
      return `<article class="lab-case" id="case-${i}" data-case="${i}"><p><strong>${c.title}</strong>${note}</p>${panel(c.panel)}</article>`;
    }).join('');
    grille.innerHTML = cases.map((c) => panel(c.panel)).join('');
    nav.innerHTML = '<p>Variantes</p>' + cases.map((c, i) =>
      `<a href="#case-${i}" data-case="${i}" title="${c.title}">${c.title}</a>`
    ).join('');

    function setCurrent(i) {
      nav.querySelectorAll('a').forEach((a) => {
        a.classList.toggle('is-on', a.getAttribute('data-case') === String(i));
      });
      fiches.querySelectorAll('.lab-case').forEach((el) => {
        el.classList.toggle('is-on', el.getAttribute('data-case') === String(i));
      });
    }

    nav.addEventListener('click', (e) => {
      const a = e.target.closest('a[data-case]');
      if (!a) return;
      e.preventDefault();
      const i = a.getAttribute('data-case');
      setCurrent(i);
      const el = document.getElementById(`case-${i}`);
      if (el) el.scrollIntoView({ block: 'start' });
    });

    function setWidth(w) {
      document.querySelectorAll('[data-w]').forEach((b) => {
        b.classList.toggle('is-on', b.getAttribute('data-w') === w);
      });
      if (w === 'full') {
        document.body.classList.add('lab-full');
        document.getElementById('stage').style.removeProperty('--lab-w');
      } else {
        document.body.classList.remove('lab-full');
        document.getElementById('stage').style.setProperty('--lab-w', `${w}px`);
      }
      try { localStorage.setItem('sports-page-lab-w', w); } catch (_) {}
    }

    function setTheme(theme) {
      document.documentElement.setAttribute('data-theme', theme);
      document.querySelectorAll('[data-theme-btn]').forEach((b) => {
        b.classList.toggle('is-on', b.getAttribute('data-theme-btn') === theme);
      });
      try { localStorage.setItem('sports-page-lab-theme', theme); } catch (_) {}
    }

    function setView(view) {
      document.querySelectorAll('[data-view]').forEach((b) => {
        b.classList.toggle('is-on', b.getAttribute('data-view') === view);
      });
      const fichesOn = view === 'fiches';
      fiches.hidden = !fichesOn;
      grille.hidden = fichesOn;
      try { localStorage.setItem('sports-page-lab-view', view); } catch (_) {}
    }

    document.querySelectorAll('[data-w]').forEach((b) => {
      b.addEventListener('click', () => setWidth(b.getAttribute('data-w')));
    });
    document.querySelectorAll('[data-theme-btn]').forEach((b) => {
      b.addEventListener('click', () => setTheme(b.getAttribute('data-theme-btn')));
    });
    document.querySelectorAll('[data-view]').forEach((b) => {
      b.addEventListener('click', () => setView(b.getAttribute('data-view')));
    });

    if (!embed) {
      const savedW = params.get('w') || (() => { try { return localStorage.getItem('sports-page-lab-w'); } catch { return null; } })();
      const savedTheme = (() => { try { return localStorage.getItem('sports-page-lab-theme'); } catch { return null; } })();
      const savedView = (() => { try { return localStorage.getItem('sports-page-lab-view'); } catch { return null; } })();
      setWidth(savedW || '390');
      setTheme(savedTheme || 'light');
      setView(savedView || 'fiches');
      setCurrent(0);

      const labFilters = document.getElementById('lab-filters');
      function applyLabPeriod(key) {
        labFilters.querySelectorAll('[data-filter-period]').forEach((b) => {
          const on = b.getAttribute('data-filter-period') === key;
          b.classList.toggle('is-active', on);
          b.setAttribute('aria-pressed', on ? 'true' : 'false');
        });
        const liveOnly = key === 'live';
        fiches.querySelectorAll('.lab-case').forEach((el) => {
          const live = !!el.querySelector('[data-live="1"], .sports-panel--live');
          el.hidden = liveOnly && !live;
        });
        grille.querySelectorAll('.sports-panel').forEach((el) => {
          const live = el.classList.contains('sports-panel--live') || el.getAttribute('data-live') === '1';
          el.hidden = liveOnly && !live;
        });
      }
      labFilters.addEventListener('click', (e) => {
        const btn = e.target.closest('[data-filter-period]');
        if (!btn) return;
        applyLabPeriod(btn.getAttribute('data-filter-period'));
      });

      const io = new IntersectionObserver((entries) => {
        const vis = entries
          .filter((e) => e.isIntersecting)
          .sort((a, b) => b.intersectionRatio - a.intersectionRatio)[0];
        if (vis) setCurrent(vis.target.getAttribute('data-case'));
      }, { root: document.getElementById('lab-main'), threshold: [0.25, 0.5, 0.75] });
      fiches.querySelectorAll('.lab-case').forEach((el) => io.observe(el));

      const formats = document.getElementById('formats');
      [390, 430, 768, 1280].forEach((w) => {
        const wrap = document.createElement('div');
        wrap.className = 'lab-frame';
        wrap.innerHTML = `<p>${w} px</p>`;
        const iframe = document.createElement('iframe');
        iframe.src = './sports-page-lab.html?embed=1';
        iframe.width = String(w);
        iframe.style.maxWidth = '100%';
        iframe.title = `Cartes sports à ${w} pixels`;
        wrap.appendChild(iframe);
        formats.appendChild(wrap);
      });
    } else {
      setTheme((() => { try { return localStorage.getItem('sports-page-lab-theme'); } catch { return 'light'; } })() || 'light');
      grille.hidden = false;
      fiches.hidden = true;
    }
  </script>
