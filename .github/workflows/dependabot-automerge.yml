name: Dependabot auto-merge
# Fusionne les PR Dependabot (mineures et majeures) une fois Vérification verte
# ET tous les autres contrôles (Mobile inclus) verts, smoke test Playwright compris. Sinon la PR reste ouverte (alerte platform-health après 30 j).
on:
  workflow_run:
    workflows: ["Vérification", "Mobile"]
    types: [completed]
permissions:
  contents: write
  pull-requests: write
  issues: write
concurrency:
  group: dependabot-automerge
  cancel-in-progress: false
jobs:
  merge:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.actor.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Fusionner si mineure ou corrective
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          pr=$(gh pr list -R "$REPO" --head "$BRANCH" --state open --json number,headRefOid,title --jq ".[] | select(.headRefOid==\"$SHA\") | .number")
          [ -n "$pr" ] || { echo "Aucune PR ouverte pour $SHA"; exit 0; }
          # Tous les contrôles doivent être terminés et verts (Mobile compris).
          states=$(gh pr view "$pr" -R "$REPO" --json statusCheckRollup --jq '[.statusCheckRollup[] | (.conclusion // .state // "PENDING")] | unique | join(",")')
          echo "Contrôles PR #$pr : $states"
          if echo "$states" | grep -Eqv '^(SUCCESS|SKIPPED|NEUTRAL)(,(SUCCESS|SKIPPED|NEUTRAL))*$'; then
            echo "Pas encore tout vert : on attend le prochain workflow_run."; exit 0
          fi
          # Vérification (job « test ») doit avoir tourné et réussi : elle inclut
          # le smoke test Playwright du site construit (test:browser:ci).
          tested=$(gh pr view "$pr" -R "$REPO" --json statusCheckRollup --jq '[.statusCheckRollup[] | select(.name=="test" and .conclusion=="SUCCESS")] | length')
          [ "${tested:-0}" -ge 1 ] || { echo "Vérification pas encore verte : on attend."; exit 0; }
          # Mineures ET majeures : tous les contrôles + smoke test verts = fusion.
          # Sinon la PR reste ouverte et la veille plateforme ouvre l'alerte après 30 j.
          gh pr merge "$pr" -R "$REPO" --squash --delete-branch
