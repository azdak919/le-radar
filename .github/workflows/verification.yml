name: Vérification

on:
  pull_request:
  workflow_dispatch:
    inputs:
      full:
        description: 'Suite navigateur complète (false = sentinelles comme une PR)'
        type: boolean
        default: true
  push:
    branches: [main]
    # Snapshots / données bot purs : pas de Chromium ni mail QG à chaque heartbeat.
    # Dès qu’un bot touche HTML/SEO/app/CSS/tests, le job tourne encore (chemins hors liste).
    paths-ignore:
      - 'news.json'
      - 'news-archive.json'
      - 'data/archives/**'
      - 'news-sources.json'
      - 'author-qc.json'
      - 'lead-excerpt-qc.json'
      - 'lead-image-qc.json'
      - 'photo-credit-qc.json'
      - 'social-feed.json'
      - 'radio-nowplaying.json'
      - 'radio-schedules.json'
      - 'radio-schedules.seed.json'
      - 'radios.json'
      - 'radios-candidates.json'
      - 'sports.json'
      - 'sports-masthead.json'
      - 'sports-leagues.json'
      - 'sports-teams.json'
      - 'sports-sailing.json'
      - 'institutions.json'
      - 'indigenous-mt.json'
      - 'archive-status.json'
      - 'historical-crawl-state.json'
      - 'historical-catalog.config.json'
      - 'feed.xml'
      - 'bot-status.json'
      - 'docs/scan-qc-report.json'
      - 'docs/scan-qc-report.md'
      - 'assets/news-images/**'

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # Les commits des bots (« LE-RADAR … Bot », github-actions[bot]) sont déjà
    # contrôlés par le bot gate (scripts/bot-prepush-check.sh) avant le push :
    # on ne relance pas toute la suite Playwright à chaque battement de données.
    if: ${{ github.event_name != 'push' || !(contains(github.event.head_commit.author.name, 'Bot') || contains(github.event.head_commit.author.name, '[bot]')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm

      - name: Install test dependencies
        run: npm ci

      # Syntaxe / données / PWA : pas besoin de navigateur. Échoue vite
      # si le hang est uniquement Playwright/Chromium.
      - name: Static and data checks
        run: npm run check

      # ubuntu-latest a déjà les libs système. `--with-deps` (apt-get)
      # peut rester bloqué 10+ min ; le binaire Playwright suffit.
      - name: Cache Playwright Chromium
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium

      # PR / push main : trois sentinelles UI (mât, chrome, smoke).
      # Les specs exhaustives tournent dans la suite complète, manuelle : ne
      # pas payer 111 tests séquentiels pour chaque push.
      - name: Browser checks (critical)
        if: github.event_name != 'workflow_dispatch' || !inputs.full
        timeout-minutes: 10
        run: npm run test:browser:ci

      - name: Browser checks (full suite)
        if: github.event_name == 'workflow_dispatch' && inputs.full
        run: npm run test:browser

      - name: Upload browser traces on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
