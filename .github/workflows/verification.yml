name: Vérification

on:
  pull_request:
  workflow_dispatch:
    inputs:
      full:
        description: 'Suite navigateur complète (false = sentinelles comme une PR)'
        type: boolean
        default: true
  push:
    branches: [main]
    # Snapshots / données bot purs : pas de Chromium ni mail QG à chaque heartbeat.
    # Dès qu’un bot touche HTML/SEO/app/CSS/tests, le job tourne encore (chemins hors liste).
    paths-ignore:
      - 'news.json'
      - 'news-archive.json'
      - 'data/archives/**'
      - 'news-sources.json'
      - 'author-qc.json'
      - 'lead-excerpt-qc.json'
      - 'lead-image-qc.json'
      - 'photo-credit-qc.json'
      - 'social-feed.json'
      - 'radio-nowplaying.json'
      - 'radio-schedules.json'
      - 'radio-schedules.seed.json'
      - 'radios.json'
      - 'radios-candidates.json'
      - 'sports.json'
      - 'sports-masthead.json'
      - 'sports-leagues.json'
      - 'sports-teams.json'
      - 'sports-sailing.json'
      - 'institutions.json'
      - 'indigenous-mt.json'
      - 'archive-status.json'
      - 'historical-crawl-state.json'
      - 'historical-catalog.config.json'
      - 'feed.xml'
      - 'bot-status.json'
      - 'docs/scan-qc-report.json'
      - 'docs/scan-qc-report.md'
      - 'assets/news-images/**'

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

# Independent runners prevent browser/HTTP-server contention between projects.
permissions:
  contents: read

jobs:
  static:
    if: ${{ (github.event_name != 'push' || !(contains(github.event.head_commit.author.name, 'Bot') || contains(github.event.head_commit.author.name, '[bot]'))) && (true) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - name: Install test dependencies
        run: npm ci
      - name: Regenerate sports pages
        run: node scripts/generate-seo.js --update --sports-only
      - name: Static and data checks
        run: npm run check

  critical:
    if: ${{ (github.event_name != 'push' || !(contains(github.event.head_commit.author.name, 'Bot') || contains(github.event.head_commit.author.name, '[bot]'))) && (github.event_name != 'workflow_dispatch' || !inputs.full) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        project: [main, serial-sensitive]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - name: Install test dependencies
        run: npm ci
      - name: Regenerate sports pages
        run: node scripts/generate-seo.js --update --sports-only
      - name: Cache Playwright Chromium
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium
      - name: Browser checks (critical)
        timeout-minutes: 30
        run: npm run test:browser:ci -- --project=${{ matrix.project }} --workers=1
      - name: Upload browser traces on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-traces-${{ matrix.project }}
          path: test-results/
          retention-days: 7

  full:
    if: ${{ (github.event_name != 'push' || !(contains(github.event.head_commit.author.name, 'Bot') || contains(github.event.head_commit.author.name, '[bot]'))) && (github.event_name == 'workflow_dispatch' && inputs.full) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - name: Install test dependencies
        run: npm ci
      - name: Regenerate sports pages
        run: node scripts/generate-seo.js --update --sports-only
      - name: Cache Playwright Chromium
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium
      # Ubuntu 24.04 : ImageMagick 6, binaire `convert` (pas `magick`).
      # Le test d’affiche accepte les deux.
      - name: Install ImageMagick
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends imagemagick
      - name: Browser checks (full suite)
        timeout-minutes: 50
        run: npm run test:browser
      - name: Upload browser traces on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-traces-full
          path: test-results/
          retention-days: 7

  # Preserve the required check name; skipped/cancelled required jobs never pass.
  test:
    if: ${{ always() && (github.event_name != 'push' || !(contains(github.event.head_commit.author.name, 'Bot') || contains(github.event.head_commit.author.name, '[bot]'))) }}
    needs: [static, critical, full]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Require successful jobs for the selected mode
        env:
          FULL: ${{ github.event_name == 'workflow_dispatch' && inputs.full }}
          STATIC_RESULT: ${{ needs.static.result }}
          CRITICAL_RESULT: ${{ needs.critical.result }}
          FULL_RESULT: ${{ needs.full.result }}
        run: node scripts/verification-gate.mjs
