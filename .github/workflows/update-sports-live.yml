name: Update Student Sports (live)

on:
  schedule:
    # Rafraîchit seulement les ligues avec un match dans la fenêtre live
    # (coup d’envoi −15 min / +3 h). GitHub Actions = UTC.
    # Plancher GitHub : 5 min. 15 min trop lent pour un score en cours.
    #
    # | UTC              | ≈ EDT            | Intention                 |
    # |------------------|------------------|---------------------------|
    # | 16:00–23:55 /5   | 12:00–19:55      | après-midi collégial      |
    # | 00:00–03:55 /5   | 20:00–23:55      | soirée + fin de match     |
    # | :20 chaque heure | filet            | GitHub lâche le */5       |
    - cron: '*/5 16-23 * * *'
    - cron: '*/5 0-3 * * *'
    - cron: '20 * * * *'
  workflow_dispatch:
  # Observé 2026-08-28 : le */5 n’a pas tiré de 12 h à 19 h QC (dernier run
  # 11:08 UTC) alors que des matchs collégiaux étaient En cours. La radio
  # now-playing (*/30) part encore → enchaîner. --live sort sans écrire s’il
  # n’y a personne dans la fenêtre.
  workflow_run:
    workflows:
      - Update Radio Now Playing
    types: [completed]

concurrency:
  group: update-sports-live-${{ github.ref }}
  cancel-in-progress: true

jobs:
  live:
    if: ${{ github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    permissions:
      contents: write
      issues: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      - name: Setup Python (sidecar Spordle TLS)
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install curl_cffi
        run: pip install --quiet 'curl_cffi>=0.7'
        continue-on-error: true

      # Boucle interne : le cron */5 de GitHub ne tire en pratique qu’aux
      # 45–90 min (observé le 17 oct. 2026 : 16:35, 17:20, 18:04, 20:29 UTC…).
      # Tant qu’un match RSEQ est dans la fenêtre live, on refait une passe
      # aux 3 min jusqu’à la fin des matchs (≈ 3 h 30 max, 70 passes ; observé 23 oct. 2026 : arrêt à 30 min → 0-0 figé pendant que c’était 3-0). Le prochain déclenchement prend le relais,
      # concurrency annule l’ancien). Dépôt public → minutes Actions gratuites.
      # Chaque passe lit aussi U SPORTS / RSEQ Direct (1 page par site) pour le
      # pointage en cours de match (scripts/sports-presto-live-lib.js) ; une
      # panne de ces sites n’échoue jamais la passe.
      - name: Fetch live RSEQ scores (boucle tant qu’un match est en fenêtre)
        env:
          HOCKEY_CACHE_URL: https://le-radar-hockey.azdak.workers.dev
          PRESTO_CACHE_URL: https://le-radar-presto.azdak.workers.dev
          LIVE_PASSES: '110'
          LIVE_LOOKAHEAD_MIN: '75'
          LIVE_SLEEP_SECONDS: '180'
          LIVE_MIN_PUSH_SECONDS: '900'
          LIVE_HEARTBEAT_SECONDS: '3600'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Push seulement sur vrai changement (scripts/sports-live-change.js) :
          #  - urgent (pointage, résultat, En cours / Final) : tout de suite ;
          #  - data (calendrier, fenêtre live) : au plus 1× / LIVE_MIN_PUSH_SECONDS ;
          #  - none (horodatages seuls) : pas de push, sauf battement si le tampon
          #    publié a plus de LIVE_HEARTBEAT_SECONDS (le gardien de fraîcheur
          #    relancerait sinon une récolte complète à 90 min).
          last_push=0
          push_live() {
            local force="${1:-}"
            local kind
            kind="$(node scripts/sports-live-change.js)"
            local now; now=$(date +%s)
            local published; published=$(git log -1 --format=%ct -- sports.json 2>/dev/null || echo 0)
            case "$kind" in
              urgent) echo "Changement de pointage / d’état : push immédiat." ;;
              data)
                if [ -z "$force" ] && [ $((now - last_push)) -lt "$LIVE_MIN_PUSH_SECONDS" ]; then
                  echo "Changement de données : regroupé (dernier push il y a $((now - last_push)) s)."
                  return 0
                fi ;;
              *)
                if [ $((now - published)) -lt "$LIVE_HEARTBEAT_SECONDS" ]; then
                  echo "Horodatages seulement : pas de push."
                  return 0
                fi
                echo "Battement : tampon publié vieux de $((now - published)) s." ;;
            esac
            git add sports.json sports-masthead.json sports-live-window.json
            if git diff --staged --quiet; then
              echo "No live sports changes."
              return 0
            fi
            git commit -q -m "chore(sports): refresh live RSEQ scores"
            bash scripts/bot-push.sh --redo "node scripts/fetch-sports.js --update --live && git add sports.json sports-masthead.json sports-live-window.json && { git diff --staged --quiet || git commit -qm 'chore(sports): refresh live RSEQ scores'; }" || return 1
            last_push=$(date +%s)
          }
          pass=1
          fails=0
          while :; do
            echo "::group::passe live $pass/${LIVE_PASSES}"
            node scripts/fetch-sports.js --update --live
            if node -e "const s=require('./sports.json').liveSourceStatus;process.exit(s && Date.now()-Date.parse(s.at)<300000 ? 0 : 1)"; then
              fails=$((fails + 1))
            fi
            push_live
            echo "::endgroup::"
            if [ "$pass" -ge "$LIVE_PASSES" ]; then
              echo "Plafond de passes atteint."
              break
            fi
            if ! node scripts/sports-live-pending.js; then
              echo "Plus aucun match en fenêtre live — fin."
              break
            fi
            pass=$((pass + 1))
            sleep "$LIVE_SLEEP_SECONDS"
            # Un changement regroupé non poussé sera reproduit par la passe
            # suivante (la collecte est complète) : on repart de main propre.
            git checkout -q -- sports.json sports-masthead.json sports-live-window.json 2>/dev/null || true
            git pull -q --rebase origin "${GITHUB_REF_NAME}" || git rebase --abort 2>/dev/null || true
          done
          # Fin de boucle : publier un changement regroupé encore en attente.
          push_live force || true
          echo "LIVE_PASSES_RUN=$pass" >> "$GITHUB_ENV"
          echo "LIVE_SOURCE_FAILS=$fails" >> "$GITHUB_ENV"

      # Alerte : une source en direct (U SPORTS / RSEQ Direct) a échoué à ≥ 3 passes
      # de ce run (ex. 23 oct. 2026 : WAF CloudFront captcha
      # sur les IP GitHub → 0-0 affiché pendant 3-0). Une seule issue ouverte,
      # commentée à chaque run fautif. Aucun courriel envoyé par le bot.
      - name: Alert on live source outage
        if: ${{ always() && env.LIVE_SOURCE_FAILS != '' && fromJSON(env.LIVE_SOURCE_FAILS) >= 3 }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          detail=$(node -e "const s=require('./sports.json').liveSourceStatus||{};console.log((s.failed||[]).join(' ; '))")
          msg="Source sports en direct en panne à ${LIVE_SOURCE_FAILS}/${LIVE_PASSES_RUN} passes (run ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}) : ${detail}"
          echo "::warning title=Source sports en direct en panne::${msg}"
          title="Sports en direct : source PrestoSports en panne"
          num=$(gh issue list --state open --search "in:title \"${title}\"" --json number --jq '.[0].number' || true)
          if [ -n "$num" ]; then
            gh issue comment "$num" --body "$msg" || true
          else
            gh issue create --title "$title" --body "$msg" || true
          fi
