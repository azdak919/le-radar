name: Update Student Sports (live)

on:
  schedule:
    # Rafraîchit seulement les ligues avec un match dans la fenêtre live
    # (coup d’envoi −15 min / +3 h). GitHub Actions = UTC.
    # Plancher GitHub : 5 min. 15 min trop lent pour un score en cours.
    #
    # | UTC              | ≈ EDT            | Intention                 |
    # |------------------|------------------|---------------------------|
    # | 16:00–23:55 /5   | 12:00–19:55      | après-midi collégial      |
    # | 00:00–03:55 /5   | 20:00–23:55      | soirée + fin de match     |
    - cron: '*/5 16-23 * * *'
    - cron: '*/5 0-3 * * *'
  workflow_dispatch:

concurrency:
  group: update-sports-live-${{ github.ref }}
  cancel-in-progress: true

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Fetch live RSEQ scores (ligues en fenêtre seulement)
        run: node scripts/fetch-sports.js --update --live

      - name: Commit sports.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sports.json sports-masthead.json
          if git diff --staged --quiet; then
            echo "No live sports changes."
            exit 0
          fi
          git commit -m "chore(sports): refresh live RSEQ scores"
          for i in 1 2 3; do
            git pull --rebase -X theirs --autostash origin "${GITHUB_REF_NAME}" && git push && exit 0
            git rebase --abort 2>/dev/null || true
            echo "push attempt $i failed, retrying…"
            sleep $((i * 3))
          done
          echo "::error::could not push live sports update after retries"
          exit 1
