name: Update Student Sports (live)

on:
  schedule:
    # Rafraîchit seulement les ligues avec un match dans la fenêtre live
    # (coup d’envoi −15 min / +3 h). GitHub Actions = UTC.
    # Plancher GitHub : 5 min. 15 min trop lent pour un score en cours.
    #
    # | UTC              | ≈ EDT            | Intention                 |
    # |------------------|------------------|---------------------------|
    # | 16:00–23:55 /5   | 12:00–19:55      | après-midi collégial      |
    # | 00:00–03:55 /5   | 20:00–23:55      | soirée + fin de match     |
    # | :20 chaque heure | filet            | GitHub lâche le */5       |
    - cron: '*/5 16-23 * * *'
    - cron: '*/5 0-3 * * *'
    - cron: '20 * * * *'
  workflow_dispatch:
  # Observé 2026-08-28 : le */5 n’a pas tiré de 12 h à 19 h QC (dernier run
  # 11:08 UTC) alors que des matchs collégiaux étaient En cours. La radio
  # now-playing (*/30) part encore → enchaîner. --live sort sans écrire s’il
  # n’y a personne dans la fenêtre.
  workflow_run:
    workflows:
      - Update Radio Now Playing
    types: [completed]

concurrency:
  group: update-sports-live-${{ github.ref }}
  cancel-in-progress: true

jobs:
  live:
    if: ${{ github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - name: Fetch live RSEQ scores (ligues en fenêtre seulement)
        run: node scripts/fetch-sports.js --update --live

      - name: Commit sports.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sports.json sports-masthead.json
          if git diff --staged --quiet; then
            echo "No live sports changes."
            exit 0
          fi
          git commit -m "chore(sports): refresh live RSEQ scores"
          for i in 1 2 3; do
            git pull --rebase -X theirs --autostash origin "${GITHUB_REF_NAME}" && git push && exit 0
            git rebase --abort 2>/dev/null || true
            echo "push attempt $i failed, retrying…"
            sleep $((i * 3))
          done
          echo "::error::could not push live sports update after retries"
          exit 1
