name: Mobile release

on:
  workflow_dispatch:
    inputs:
      platform:
        description: android, ios, or both
        required: true
        default: both
        type: choice
        options:
          - both
          - android
          - ios
      upload:
        description: Envoyer vers Play ou App Store Connect après la construction
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  android:
    if: inputs.platform == 'android' || inputs.platform == 'both'
    runs-on: ubuntu-latest
    environment: play-store
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: platforms;android-36 build-tools;36.0.0 platform-tools

      - name: Require the upload key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64" || { echo "Secret ANDROID_KEYSTORE_BASE64 manquant"; exit 1; }
          test -n "$ANDROID_KEYSTORE_PASSWORD" || { echo "Secret ANDROID_KEYSTORE_PASSWORD manquant"; exit 1; }
          test -n "$ANDROID_KEY_ALIAS" || { echo "Secret ANDROID_KEY_ALIAS manquant"; exit 1; }
          test -n "$ANDROID_KEY_PASSWORD" || { echo "Secret ANDROID_KEY_PASSWORD manquant"; exit 1; }
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/upload-key.keystore
          cat > android/keystore.properties <<EOF
          storeFile=upload-key.keystore
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          EOF

      - name: Signed App Bundle
        run: npm ci && npm run android:bundle

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: le-radar-release-aab
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error

      - name: Play upload is manual
        if: inputs.upload
        run: |
          echo "L’AAB signé est dans l’artefact le-radar-release-aab."
          echo "Le dépôt ne pousse pas vers Play automatiquement."
          echo "Play Console → Test interne → créer une version → téléverser cet AAB."
          echo "Voir docs/mobile/publishing.md."

  ios:
    if: inputs.platform == 'ios' || inputs.platform == 'both'
    runs-on: macos-latest
    environment: app-store
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm

      - name: Require App Store Connect API key and team
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_STORE_CONNECT_KEY_ID: ${{ secrets.APPLE_APP_STORE_CONNECT_KEY_ID }}
          APPLE_APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APPLE_APP_STORE_CONNECT_ISSUER_ID }}
          APPLE_APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APPLE_APP_STORE_CONNECT_API_KEY_BASE64 }}
        run: |
          test -n "$APPLE_TEAM_ID" || { echo "Secret APPLE_TEAM_ID manquant"; exit 1; }
          test -n "$APPLE_APP_STORE_CONNECT_KEY_ID" || { echo "Secret APPLE_APP_STORE_CONNECT_KEY_ID manquant"; exit 1; }
          test -n "$APPLE_APP_STORE_CONNECT_ISSUER_ID" || { echo "Secret APPLE_APP_STORE_CONNECT_ISSUER_ID manquant"; exit 1; }
          test -n "$APPLE_APP_STORE_CONNECT_API_KEY_BASE64" || { echo "Secret APPLE_APP_STORE_CONNECT_API_KEY_BASE64 manquant"; exit 1; }
          mkdir -p "$RUNNER_TEMP/private"
          echo "$APPLE_APP_STORE_CONNECT_API_KEY_BASE64" | base64 -d > "$RUNNER_TEMP/private/AuthKey.p8"
          echo "APPLE_TEAM_ID=$APPLE_TEAM_ID" >> "$GITHUB_ENV"
          echo "APPLE_KEY_ID=$APPLE_APP_STORE_CONNECT_KEY_ID" >> "$GITHUB_ENV"
          echo "APPLE_ISSUER_ID=$APPLE_APP_STORE_CONNECT_ISSUER_ID" >> "$GITHUB_ENV"
          echo "APPLE_KEY_PATH=$RUNNER_TEMP/private/AuthKey.p8" >> "$GITHUB_ENV"

      - name: Sync and archive
        run: |
          npm ci
          npm run mobile:sync
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/LE-RADAR.xcarchive" \
            -allowProvisioningUpdates \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGN_STYLE=Automatic \
            -authenticationKeyPath "$APPLE_KEY_PATH" \
            -authenticationKeyID "$APPLE_KEY_ID" \
            -authenticationKeyIssuerID "$APPLE_ISSUER_ID" \
            archive

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: le-radar-xcarchive
          path: ${{ runner.temp }}/LE-RADAR.xcarchive
          if-no-files-found: error

      - name: App Store upload is manual
        if: inputs.upload
        run: |
          echo "L’archive est dans l’artefact le-radar-xcarchive."
          echo "Le dépôt ne pousse pas vers App Store Connect automatiquement."
          echo "Ouvrir l’archive dans Xcode Organizer, ou exporter un IPA puis utiliser altool avec la clé API."
          echo "Voir docs/mobile/publishing.md."
