name: Probe Indigenous MT engines

on:
  schedule:
    # 1er du mois à 14:00 UTC ≈ 10:00 EDT / 09:00 EST
    - cron: '0 14 1 * *'
  workflow_dispatch: {}

concurrency:
  # Un seul écrivain de données à la fois sur main (file d'attente FIFO).
  group: data-writers
  cancel-in-progress: false
  queue: max

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      # Partir du main ACTUEL : en file data-writers, le sha de l'événement
      # peut dater de plusieurs passes (rebase de données impossible ensuite).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      - name: Probe public MT engines for Québec Indigenous languages
        id: probe
        run: node scripts/probe-indigenous-mt.js
        env:
          CI: true

      - name: Commit registry if languages newly enabled
        if: steps.probe.outputs.changed == 'true'
        run: |
          git config user.name "LE-RADAR Indigenous MT Bot"
          git config user.email "actions@users.noreply.github.com"
          git add indigenous-mt.json
          MSG="bot: indigenous MT probe"
          if [ -n "$NEWLY_ENABLED" ]; then
            MSG="bot: enable indigenous MT — $NEWLY_ENABLED"
          else
            MSG="bot: refresh indigenous-mt.json probe results"
          fi
          git commit -m "$MSG" || exit 0
          bash scripts/bot-push.sh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEWLY_ENABLED: ${{ steps.probe.outputs.newly_enabled }}
