name: Verify Historical Article Links

on:
  schedule:
    # Une fois par semaine : échantillon borné, une URL à la fois.
    - cron: '20 6 * * 0'
  workflow_dispatch:

concurrency:
  group: verify-historical-links-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - name: Verify a bounded, representative sample
        id: links
        run: node scripts/verify-historical-links.js --update --limit=20
        # Les pannes individuelles deviennent des statuts dans le registre;
        # cette garde évite qu’un incident inattendu ne génère un courriel de
        # Vérification pour un chantier expérimental.
        continue-on-error: true
      - name: Regenerate the public sample
        if: steps.links.outcome == 'success'
        run: node scripts/generate-seo.js --update
        continue-on-error: true
      - name: Pre-push integrity (bot gate)
        if: steps.links.outcome == 'success'
        timeout-minutes: 8
        run: |
          if git diff --quiet; then
            echo "No diff — skip prepush."
            exit 0
          fi
          bash scripts/bot-prepush-check.sh
      - name: Commit verified metadata when changed
        if: steps.links.outcome == 'success'
        run: |
          if git diff --quiet; then
            echo "No historical catalogue change."
            exit 0
          fi
          git config user.name "LE-RADAR History Bot"
          git config user.email "actions@users.noreply.github.com"
          git add news-archive.json sitemap-archives.xml llms.txt
          git add -A archives journaux en
          git commit -m "bot: verify historical article links (auto)" || exit 0
          git pull --rebase --autostash origin main
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
