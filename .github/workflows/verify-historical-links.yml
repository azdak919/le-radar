name: Verify Historical Article Links

on:
  schedule:
    # Une fois par semaine : échantillon borné, une URL à la fois.
    - cron: '20 6 * * 0'
  workflow_dispatch:

concurrency:
  # Un seul écrivain de données à la fois sur main (file d'attente FIFO).
  group: data-writers
  cancel-in-progress: false
  queue: max

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    permissions:
      contents: write
    steps:
      # Partir du main ACTUEL : en file data-writers, le sha de l'événement
      # peut dater de plusieurs passes (rebase de données impossible ensuite).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Verify a bounded, representative sample
        id: links
        run: node scripts/verify-historical-links.js --update --limit=20
        # Les pannes individuelles deviennent des statuts dans le registre;
        # cette garde évite qu’un incident inattendu ne génère un courriel de
        # Vérification pour un chantier expérimental.
        continue-on-error: true
      - name: Pre-push integrity (bot gate)
        if: steps.links.outcome == 'success'
        timeout-minutes: 8
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "No diff — skip prepush."
            exit 0
          fi
          bash scripts/bot-prepush-check.sh
      - name: Commit verified metadata when changed
        if: steps.links.outcome == 'success'
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "No historical catalogue change."
            exit 0
          fi
          git config user.name "LE-RADAR History Bot"
          git config user.email "actions@users.noreply.github.com"
          # news-archive.json appartient à Update Student News (lot D) : on ne
          # publie que notre boîte d'envoi, qu'il fusionne au passage suivant.
          git add data/archive-inbox/verify-historical-links.json
          git commit -m "bot: verify historical article links (auto)" || exit 0
          bash scripts/bot-push.sh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
