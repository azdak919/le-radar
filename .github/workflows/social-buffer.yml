name: Social — Buffer (X @LeRadar_ca, Pages Facebook et LinkedIn)

# Feed.xml → file Buffer (forfait gratuit, 10 posts) → X. Coût : 0 $.
# Canaux : X, Page Facebook et page LinkedIn « LE-RADAR.ca » (scripts/social/buffer-pages-post.mjs :
# places libres seulement, heures de pointe de data/social/posting-windows.json, rodage, aucun @).
on:
  schedule:
    # Une passe par nuit ≈ 3 h Toronto (3 h 07 HNE, 4 h 07 HAE) : articles de la veille, 10 max.
    - cron: '7 8 * * *'
    - cron: '41 13 * * 1'   # rapport hebdo des comptes (lundi)
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Essai seulement (aucun envoi à Buffer)'
        type: boolean
        default: false
      max_new:
        description: 'Nombre max de nouvelles publications pour ce passage (vide = remplir jusqu à 10)'
        type: string
        default: ''
      max_age_h:
        description: 'Âge max des articles en heures (vide = 72)'
        type: string
        default: ''
      slot_times:
        description: 'Programmer AUJOURD HUI à ces heures America/Toronto, ex. 07:30,09:00 (vide = file Buffer)'
        type: string
        default: ''
      daily:
        description: 'Mode nocturne : articles de la veille, créneaux fixes du jour'
        type: boolean
        default: false
      reformat:
        description: 'Remettre la file au format « Média • Auteur • Titre : extrait » (editPost, même id/heure) au lieu de remplir'
        type: boolean
        default: false
      share_now:
        description: 'Publier tout de suite UN article au hasard (hors file et hors état)'
        type: boolean
        default: false
      share_url:
        description: 'Avec share_now : URL de l’article précis à publier (même article sur tous les réseaux)'
        type: string
        default: ''
      report:
        description: 'Générer aussi le rapport des comptes X'
        type: boolean
        default: false
      only:
        description: 'Réseaux de ce passage'
        type: choice
        options: [all, x, pages]
        default: all

env:
  # Date d'expiration de la clé Buffer « le-radar-github » (pas un secret).
  BUFFER_KEY_EXPIRES: '2027-11-01'

permissions:
  contents: write
  issues: write

concurrency:
  group: data-writers-social
  cancel-in-progress: false
  queue: max

jobs:
  queue:
    if: github.event.schedule != '41 13 * * 1'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Rappel d'expiration de la clé Buffer (issue unique)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          LEFT=$(( ( $(date -d "$BUFFER_KEY_EXPIRES" +%s) - $(date +%s) ) / 86400 ))
          echo "Clé Buffer : expire le $BUFFER_KEY_EXPIRES (dans $LEFT jours)"
          [ "$LEFT" -ge 30 ] && exit 0
          TITLE="Clé Buffer à renouveler"
          NUM=$(gh issue list --repo "${{ github.repository }}" --state open --search "in:title \"${TITLE}\"" --json number,title --jq "[.[] | select(.title == \"${TITLE}\")][0].number // empty")
          [ -n "$NUM" ] && exit 0
          gh issue create --repo "${{ github.repository }}" --title "$TITLE" --body "La clé d'API Buffer « le-radar-github » expire le ${BUFFER_KEY_EXPIRES} (dans ${LEFT} jours). Régénérer la clé dans Buffer › Settings › API, remplacer le secret BUFFER_API_KEY, puis mettre à jour BUFFER_KEY_EXPIRES dans .github/workflows/social-buffer.yml."
      - name: Reformater la file Buffer (sans ligne vide)
        if: inputs.reformat
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          BUFFER_CHANNEL_ID: ${{ vars.BUFFER_CHANNEL_ID }}
          DRY_RUN: ${{ inputs.dry_run && 'true' || 'false' }}
        run: node scripts/social/reformat-queue.mjs
      - name: Remplir la file Buffer
        if: ${{ !inputs.reformat && inputs.only != 'pages' }}
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          BUFFER_CHANNEL_ID: ${{ vars.BUFFER_CHANNEL_ID }}
          MAX_NEW: ${{ inputs.max_new }}
          MAX_AGE_H: ${{ inputs.max_age_h }}
          SLOT_TIMES: ${{ inputs.slot_times }}
          SHARE_NOW: ${{ inputs.share_now && 'true' || 'false' }}
          SHARE_URL: ${{ inputs.share_url }}
          DAILY: ${{ (github.event_name == 'schedule' || inputs.daily) && 'true' || 'false' }}
          DRY_RUN: ${{ inputs.dry_run && 'true' || 'false' }}
        run: node scripts/social/buffer-post.mjs
      - name: Pages Facebook et LinkedIn (places libres, heures de pointe)
        id: pages
        if: ${{ !inputs.reformat && (!inputs.share_now || inputs.share_url != '') && inputs.only != 'x' }}
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          BUFFER_FACEBOOK_CHANNEL_ID: ${{ vars.BUFFER_FACEBOOK_CHANNEL_ID }}
          BUFFER_LINKEDIN_CHANNEL_ID: ${{ vars.BUFFER_LINKEDIN_CHANNEL_ID }}
          PAGES_ISSUE_FILE: /tmp/pages-issue.md
          SHARE_NOW: ${{ inputs.share_now && 'true' || 'false' }}
          SHARE_URL: ${{ inputs.share_url }}
          DRY_RUN: ${{ inputs.dry_run && 'true' || 'false' }}
        run: node scripts/social/buffer-pages-post.mjs
      # UNE seule issue (créée ou mise à jour) si Buffer ou le réseau refuse un post ; jamais de doublon.
      - name: Issue unique si refus Facebook / LinkedIn
        if: always() && steps.pages.outcome != 'skipped'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ -s /tmp/pages-issue.md ] || exit 0
          [ "${{ inputs.dry_run }}" = "true" ] && { cat /tmp/pages-issue.md; exit 0; }
          TITLE="Social : publication Facebook / LinkedIn refusée"
          NUM=$(gh issue list --repo "${{ github.repository }}" --state open --search "in:title \"${TITLE}\"" --json number,title --jq "[.[] | select(.title == \"${TITLE}\")][0].number // empty")
          if [ -n "$NUM" ]; then gh issue edit "$NUM" --repo "${{ github.repository }}" --body-file /tmp/pages-issue.md
          else gh issue create --repo "${{ github.repository }}" --title "$TITLE" --body-file /tmp/pages-issue.md; fi
      - name: Commit de l'état (data/buffer-sent.json, data/buffer-pages-sent.json)
        if: always()
        run: |
          git diff --quiet -- data/buffer-sent.json data/buffer-pages-sent.json && { echo "État inchangé."; exit 0; }
          git config user.name "Azdak"
          git config user.email "azdak-qc@proton.me"
          git add data/buffer-sent.json
          git add data/buffer-pages-sent.json
          git commit -s -m "bot(social): état des publications Buffer"
          GITHUB_REF_NAME=main bash scripts/bot-push.sh --verify "node -e 'for (const f of [\"data/buffer-sent.json\",\"data/buffer-pages-sent.json\"]) JSON.parse(require(\"fs\").readFileSync(f))'"

  accounts-report:
    if: github.event.schedule == '41 13 * * 1' || inputs.report
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - run: node scripts/social/accounts-report.mjs /tmp/report.md
      # UNE seule issue permanente, mise à jour (jamais de doublon).
      - name: Sync issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TITLE="Social : comptes X à vérifier"
          NUM=$(gh issue list --repo "${{ github.repository }}" --state all --search "in:title \"${TITLE}\"" --json number,title --jq "[.[] | select(.title == \"${TITLE}\")][0].number // empty")
          if [ -n "$NUM" ]; then
            gh issue edit "$NUM" --repo "${{ github.repository }}" --body-file /tmp/report.md
          else
            gh issue create --repo "${{ github.repository }}" --title "$TITLE" --body-file /tmp/report.md
          fi
