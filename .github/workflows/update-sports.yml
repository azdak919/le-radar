name: Update Student Sports (RSEQ)

on:
  schedule:
    # Heures de consultation des scores étudiants (Amérique/Toronto).
    # GitHub Actions = UTC seulement → cibles ±1 h selon EST/EDT.
    #
    # | UTC        | ≈ EDT (été) | ≈ EST (hiver) | Intention              |
    # |------------|-------------|---------------|------------------------|
    # | 11:30      | 07:30       | 06:30         | matin / trajet         |
    # | 16:15      | 12:15       | 11:15         | pause midi             |
    # | 20:45      | 16:45       | 15:45         | fin de cours           |
    # | 00:00      | 20:00       | 19:00         | soirée matchs          |
    # | 02:30      | 22:30       | 21:30         | scores post-match      |
    # | 04:15      | 00:15       | 23:15         | rattrapage tardif      |
    # | 18:00 sam/dim | 14:00    | 13:00         | matchs d’après-midi WE |
    - cron: '30 11 * * *'
    - cron: '15 16 * * *'
    - cron: '45 20 * * *'
    - cron: '0 0 * * *'
    - cron: '30 2 * * *'
    - cron: '15 4 * * *'
    - cron: '0 18 * * 0,6'
  workflow_dispatch:

concurrency:
  group: update-sports-${{ github.ref }}
  cancel-in-progress: true

jobs:
  aggregate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '24'

      - name: Fetch RSEQ sports (tous sports, sans exception)
        run: node scripts/fetch-sports.js --update

      # /sports/ est du HTML prérendu (sports-board.js ne refetch pas).
      # Sans cette passe, le tampon « Mise à jour » et les cartes restent
      # figés même si sports.json est frais.
      - name: Refresh /sports/ HTML from sports.json
        continue-on-error: true
        timeout-minutes: 3
        run: node scripts/generate-seo.js --update --sports-only
        env:
          CI: true

      - name: Commit sports.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sports.json sports-masthead.json sports/index.html en/sports/index.html
          if git diff --staged --quiet; then
            echo "No sports changes (payload identique après re-fetch)."
            exit 0
          fi
          git commit -m "chore(sports): refresh RSEQ results"
          # Fichiers générés : en cas de conflit avec un commit concurrent,
          # -X theirs garde la version fraîchement produite par ce bot.
          for i in 1 2 3; do
            git pull --rebase -X theirs --autostash origin "${GITHUB_REF_NAME}" && git push && exit 0
            git rebase --abort 2>/dev/null || true
            echo "push attempt $i failed, retrying…"
            sleep $((i * 3))
          done
          echo "::error::could not push sports update after retries"
          exit 1
