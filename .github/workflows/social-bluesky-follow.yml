name: Social — Bluesky abonnements

# Suit data/social/bluesky-follows.json : idempotent (déjà suivis sautés), ≤ 5 par passe, ≤ 25 / 24 h,
# délais aléatoires 20–60 s, départ décalé, arrêt à la première erreur. Coût : 0 $.
on:
  schedule:
    - cron: '23 14,18,22 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Essai seulement'
        type: boolean
        default: false
      max_follows:
        description: 'Max par passe'
        type: string
        default: '5'

permissions:
  contents: read

concurrency:
  group: social-bluesky-follow
  cancel-in-progress: false

jobs:
  follow:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - env:
          BLUESKY_HANDLE: ${{ vars.BLUESKY_HANDLE }}
          BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
          DRY_RUN: ${{ inputs.dry_run && 'true' || 'false' }}
          MAX_FOLLOWS: ${{ inputs.max_follows || '5' }}
        run: node scripts/social/bluesky-follow.mjs
