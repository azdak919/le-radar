name: Retro-crawl Historical Metadata

on:
  schedule:
    # Trois sources, quatre pages de listes publiques (12 requêtes au plus) : une passe quotidienne
    # répartit le travail sans rafale ni concurrence avec le fil vivant.
    - cron: '45 6 * * *'
  workflow_dispatch:

concurrency:
  # Un seul écrivain de données à la fois sur main (file d'attente FIFO).
  group: data-writers
  cancel-in-progress: false
  queue: max

jobs:
  crawl:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      # Partir du main ACTUEL : en file data-writers, le sha de l'événement
      # peut dater de plusieurs passes (rebase de données impossible ensuite).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Collect a polite, resumable metadata-only slice
        id: crawl
        run: node scripts/retro-crawl-historical.js --update
        # Un média qui ferme son API est un état à consigner, jamais un motif
        # de courriel Vérification ni un blocage de l’agrégation quotidienne.
        continue-on-error: true
        env:
          FIREBASE_POLYSCOPE_API_KEY: ${{ secrets.FIREBASE_POLYSCOPE_API_KEY }}
      - name: Verify a small rotating sample of original links
        if: steps.crawl.outcome == 'success'
        id: links
        run: node scripts/verify-historical-links.js --update --limit=12
        continue-on-error: true
      - name: Pre-push integrity (bot gate)
        if: steps.crawl.outcome == 'success'
        timeout-minutes: 8
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "No diff — skip prepush."
            exit 0
          fi
          bash scripts/bot-prepush-check.sh
      - name: Commit only the historical artefacts
        if: steps.crawl.outcome == 'success'
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "No historical catalogue change."
            exit 0
          fi
          git config user.name "LE-RADAR History Bot"
          git config user.email "actions@users.noreply.github.com"
          # news-archive.json appartient à Update Student News (lot D) : on ne
          # publie que nos boîtes d'envoi, qu'il fusionne au passage suivant.
          git add historical-crawl-state.json
          for f in data/archive-inbox/retro-crawl.json data/archive-inbox/verify-historical-links.json; do
            [ -e "$f" ] && git add "$f"
          done
          git commit -m "bot: retro-crawl historical metadata (auto)" || exit 0
          bash scripts/bot-push.sh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
