name: Social — Bluesky (@le-radar.bsky.social)

# Articles frais du flux (≤ 24 h, après la mise en service), plafond de base 10/h et 150/24 h, modulé par data/social/posting-windows.json et le rodage
# (scripts/social/rate-limit.mjs), sélection comme X au-delà. Coût : 0 $.
# Déclencheur principal : Worker le-radar-news-trigger (≤ 5 min après chaque créneau).
# Cron de secours ci-dessous (GitHub en saute souvent). Idempotent : data/bluesky-sent.json.
on:
  schedule:
    - cron: '20,50 11-23,0-3 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Essai seulement (aucune publication)'
        type: boolean
        default: false
      share_now:
        description: 'Publier tout de suite UN article récent au hasard (hors choix X)'
        type: boolean
        default: false
      bot_label:
        description: 'Ajouter l’étiquette « bot » au profil (autres champs conservés) — avec dry_run : essai'
        type: boolean
        default: false
      set_bio:
        description: 'Appliquer la bio et le nom affiché (data/social/bluesky-bio.txt, bluesky-display-name.txt) (autres champs conservés) — avec dry_run : essai'
        type: boolean
        default: false
      set_images:
        description: 'Appliquer l’avatar et la bannière HD (data/social/bluesky-avatar.png, bluesky-banner.jpg) (autres champs conservés) — avec dry_run : essai'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: data-writers-social
  cancel-in-progress: false
  queue: max

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Étiquette « bot » du profil
        if: inputs.bot_label || inputs.set_bio || inputs.set_images
        env:
          BLUESKY_HANDLE: ${{ vars.BLUESKY_HANDLE }}
          BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
          DRY_RUN: ${{ inputs.dry_run && 'true' || 'false' }}
          SET_BIO: ${{ inputs.set_bio && 'true' || 'false' }}
          SET_IMAGES: ${{ inputs.set_images && 'true' || 'false' }}
        run: node scripts/social/bluesky-label.mjs
      - name: Publier les articles frais
        if: ${{ !inputs.bot_label && !inputs.set_bio && !inputs.set_images }}
        env:
          BLUESKY_HANDLE: ${{ vars.BLUESKY_HANDLE }}
          BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
          DRY_RUN: ${{ inputs.dry_run && 'true' || 'false' }}
          SHARE_NOW: ${{ inputs.share_now && 'true' || 'false' }}
        run: node scripts/social/bluesky-post.mjs
      - name: Commit de l'état (data/bluesky-sent.json seulement)
        if: always()
        run: |
          git diff --quiet -- data/bluesky-sent.json && { echo "État inchangé."; exit 0; }
          git config user.name "Azdak"
          git config user.email "azdak-qc@proton.me"
          git add data/bluesky-sent.json
          git commit -s -m "bot(social): état des publications Bluesky"
          GITHUB_REF_NAME=main bash scripts/bot-push.sh --verify "node -e 'JSON.parse(require(\"fs\").readFileSync(\"data/bluesky-sent.json\"))'"
