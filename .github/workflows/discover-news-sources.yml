name: Discover & Maintain News Sources

on:
  schedule:
    # Sporadic: once a week, Monday 07:00 UTC
    - cron: '0 7 * * 1'
  workflow_dispatch:   # Allow manual trigger

concurrency:
  group: discover-news-${{ github.ref }}
  cancel-in-progress: false

jobs:
  maintain:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      issues: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      # Exploration des sites d'établissements (8 par semaine) : alimente
      # news-sources.json → candidates. Ne promeut rien elle-même.
      - name: Scan institution sites for new student media
        timeout-minutes: 10
        run: node scripts/scan-media.js --update
        continue-on-error: true
        env:
          CI: true

      # Santé des flux + découverte : les candidats qui passent les critères
      # stricts (scripts/source-admission-lib.js) sont AJOUTÉS automatiquement.
      # Retrait définitif : data/source-blocklist.json.
      - name: Health-check feeds + discover and auto-add student media
        id: discover
        run: node scripts/discover-news-sources.js --update
        env:
          CI: true

      - name: Rebuild news feed (reflect any promotions / dead feeds)
        run: node scripts/fetch-news.js --update
        env:
          CI: true
          FIREBASE_POLYSCOPE_API_KEY: ${{ secrets.FIREBASE_POLYSCOPE_API_KEY }}

      # fetch-news réécrit news.json sans toucher feed.xml. Le gate compare
      # les 10 premières manchettes : sans cette étape le lundi échoue et
      # rien n'est publié.
      - name: Rebuild RSS from news.json
        run: node scripts/generate-feed.js --update

      - name: Check for changes
        id: check
        run: |
          if git diff --quiet news-sources.json news.json news-archive.json feed.xml brand-colors.json radios-candidates.json; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      # Référencement : les pages d'entités, le sitemap et llms.txt dérivent
      # de ce registre. Sans cette étape, une nouvelle entrée n'aurait sa page
      # qu'à la passe hebdomadaire de maintain.yml.
      # continue-on-error : un échec du référencement ne doit jamais bloquer
      # la publication des données.
      - name: Regenerate SEO artefacts
        if: steps.check.outputs.changed == 'true'
        run: node scripts/generate-seo.js --update
        continue-on-error: true

      - name: Pre-push integrity (bot gate)
        if: steps.check.outputs.changed == 'true'
        timeout-minutes: 8
        run: bash scripts/bot-prepush-check.sh

      - name: Commit and push updates
        if: steps.check.outputs.changed == 'true'
        run: |
          git config user.name "LE-RADAR News Bot"
          git config user.email "actions@users.noreply.github.com"
          git add news-sources.json news.json news-archive.json historical-catalog.config.json feed.xml index.html sitemap.xml sitemap-archives.xml llms.txt brand-colors.json radios-candidates.json data/news-discovery.md
          git add -A radios journaux etablissements medias horaires en archives 2>/dev/null || true
          git commit -m "bot: maintain news sources + refresh feed (auto) — ajouts : ${{ steps.discover.outputs.added || 0 }}"
          # Fichiers générés : en cas de conflit avec un commit concurrent,
          # -X theirs garde la version fraîchement produite par ce bot, et un
          # rebase interrompu est abandonné avant la tentative suivante —
          # sinon les retries échouent tous sur « unmerged files ».
          for i in 1 2 3; do
            git pull --rebase -X theirs --autostash origin "${GITHUB_REF_NAME}" && node scripts/dedupe-news-json.js --commit && node tests/data-integrity.mjs && git push && exit 0
            git rebase --abort 2>/dev/null || true
            echo "push attempt $i failed, retrying…"
            sleep $((i * 3))
          done
          echo "::error::could not push bot update after retries"
          exit 1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # UNE seule issue permanente : journal de la découverte (ajouts
      # automatiques + candidats écartés et pourquoi). Mise à jour à chaque
      # passe, jamais recréée. Ce n'est pas une demande d'approbation.
      - name: Sync discovery log issue
        if: always() && steps.discover.outcome == 'success'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TITLE="Découverte des médias étudiants (bot)"
          [ -f data/news-discovery.md ] || exit 0
          NUM=$(gh issue list --repo "${{ github.repository }}" --state all --search "in:title \"${TITLE}\"" --json number,title --jq "[.[] | select(.title == \"${TITLE}\")][0].number // empty")
          if [ -n "$NUM" ]; then
            gh issue edit "$NUM" --repo "${{ github.repository }}" --body-file data/news-discovery.md
            gh issue reopen "$NUM" --repo "${{ github.repository }}" 2>/dev/null || true
          else
            gh issue create --repo "${{ github.repository }}" --title "$TITLE" --body-file data/news-discovery.md
          fi
