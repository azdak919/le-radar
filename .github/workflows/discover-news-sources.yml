name: Discover & Maintain News Sources

on:
  schedule:
    # Sporadic: once a week, Monday 07:00 UTC
    - cron: '0 7 * * 1'
  workflow_dispatch:   # Allow manual trigger

concurrency:
  # Un seul écrivain de données à la fois sur main (file d'attente FIFO).
  group: data-writers
  cancel-in-progress: false
  queue: max

jobs:
  maintain:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: write
      issues: write

    steps:
      # Partir du main ACTUEL : en file data-writers, le sha de l'événement
      # peut dater de plusieurs passes (rebase de données impossible ensuite).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      # Exploration des sites d'établissements (8 par semaine) : alimente
      # news-sources.json → candidates. Ne promeut rien elle-même.
      - name: Scan institution sites for new student media
        timeout-minutes: 10
        run: node scripts/scan-media.js --update
        continue-on-error: true
        env:
          CI: true

      # Santé des flux + découverte : les candidats qui passent les critères
      # stricts (scripts/source-admission-lib.js) sont AJOUTÉS automatiquement.
      # Retrait définitif : data/source-blocklist.json.
      - name: Health-check feeds + discover and auto-add student media
        id: discover
        run: node scripts/discover-news-sources.js --update
        env:
          CI: true

      - name: Check for changes
        id: check
        run: |
          if git diff --quiet news-sources.json historical-catalog.config.json brand-colors.json radios-candidates.json data/news-discovery.md; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Pre-push integrity (bot gate)
        if: steps.check.outputs.changed == 'true'
        timeout-minutes: 8
        run: bash scripts/bot-prepush-check.sh

      - name: Commit and push updates
        if: steps.check.outputs.changed == 'true'
        run: |
          git config user.name "LE-RADAR News Bot"
          git config user.email "actions@users.noreply.github.com"
          for f in news-sources.json historical-catalog.config.json brand-colors.json radios-candidates.json data/news-discovery.md; do
            [ -e "$f" ] && git add "$f"
          done
          git commit -m "bot: maintain news sources (auto) — ajouts : ${{ steps.discover.outputs.added || 0 }}"
          bash scripts/bot-push.sh
          # Seul Update Student News écrit news.json, l'archive, feed.xml et le
          # SEO (lot D) : on le relance au lieu de récolter ici.
          gh workflow run update-news.yml --ref main -R "$GITHUB_REPOSITORY"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ github.token }}

      # UNE seule issue permanente : journal de la découverte (ajouts
      # automatiques + candidats écartés et pourquoi). Mise à jour à chaque
      # passe, jamais recréée. Ce n'est pas une demande d'approbation.
      - name: Sync discovery log issue
        if: always() && steps.discover.outcome == 'success'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TITLE="Découverte des médias étudiants (bot)"
          [ -f data/news-discovery.md ] || exit 0
          NUM=$(gh issue list --repo "${{ github.repository }}" --state all --search "in:title \"${TITLE}\"" --json number,title --jq "[.[] | select(.title == \"${TITLE}\")][0].number // empty")
          if [ -n "$NUM" ]; then
            gh issue edit "$NUM" --repo "${{ github.repository }}" --body-file data/news-discovery.md
            gh issue reopen "$NUM" --repo "${{ github.repository }}" 2>/dev/null || true
          else
            gh issue create --repo "${{ github.repository }}" --title "$TITLE" --body-file data/news-discovery.md
          fi
