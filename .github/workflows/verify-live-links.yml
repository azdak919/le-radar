name: Verify Live Article Links

on:
  schedule:
    # Quatre fois par jour, décalé des récoltes (:25) et du filet (:20).
    # Le flux RSS peut garder un article dont la page publique est déjà 404.
    - cron: '40 */6 * * *'
  workflow_dispatch:

concurrency:
  # Un seul écrivain de données à la fois sur main (file d'attente FIFO).
  group: data-writers
  cancel-in-progress: false
  queue: max

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      actions: write
    steps:
      # Partir du main ACTUEL : en file data-writers, le sha de l'événement
      # peut dater de plusieurs passes (rebase de données impossible ensuite).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Check live article pages
        id: links
        run: node scripts/verify-live-links.js --update
        # Une URL en panne devient un statut. Seul un crash du script échoue.
      - name: Pre-push integrity (bot gate)
        if: steps.links.outcome == 'success'
        timeout-minutes: 8
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "No diff — skip prepush."
            exit 0
          fi
          bash scripts/bot-prepush-check.sh
      - name: Commit withdrawn articles when the ledger changes
        if: steps.links.outcome == 'success'
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "No live-link change."
            exit 0
          fi
          git config user.name "LE-RADAR Link Bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/live-link-health.json
          git commit -m "bot: record articles whose source page is gone (auto)" || exit 0
          bash scripts/bot-push.sh
          # Seul Update Student News écrit news.json, feed.xml et le SEO (lot D) :
          # il applique ce registre ; on le relance pour retirer vite l'article.
          gh workflow run update-news.yml --ref main -R "$GITHUB_REPOSITORY"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ github.token }}
