name: Déploiement — Worker news-trigger (Cloudflare)

# Déploie cloudflare/news-trigger (le déclencheur de secours des crons GitHub) à chaque changement sur main, sans
# intervention humaine (28 nov. 2026, Charles). Jeton : CLOUDFLARE_API_TOKEN s'il existe (droits « Workers Scripts:
# Edit »), sinon CLOUDFLARE_AI_TOKEN. Le secret GH_TOKEN du Worker est déjà posé côté Cloudflare et n'est pas touché.
on:
  push:
    branches: [main]
    paths:
      - 'cloudflare/news-trigger/**'
      - '.github/workflows/deploy-news-trigger.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-news-trigger
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Tests du déclencheur
        run: node tests/news-trigger.mjs
      - name: Déployer le Worker
        working-directory: cloudflare/news-trigger
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CLOUDFLARE_AI_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Jeton ou compte Cloudflare absent (CLOUDFLARE_API_TOKEN ou CLOUDFLARE_AI_TOKEN, CLOUDFLARE_ACCOUNT_ID)."
            exit 1
          fi
          npx --yes wrangler@4.20.0 deploy 2>&1 | tee deploy.log
          code=${PIPESTATUS[0]}
          if [ "$code" -ne 0 ]; then
            if grep -qiE 'Authentication error|10000|not authorized|permission' deploy.log; then
              echo "::error::Le jeton Cloudflare n'a pas le droit de déployer des Workers. Créer une fois un jeton « Edit Cloudflare Workers » et l'enregistrer comme secret CLOUDFLARE_API_TOKEN du dépôt."
            fi
            exit "$code"
          fi
