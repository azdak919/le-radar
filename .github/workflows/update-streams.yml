name: Update Radio Streams

on:
  schedule:
    # Run every day at 6am UTC
    - cron: '0 6 * * *'
  workflow_dispatch:   # Allow manual trigger

# Never run two stream-update jobs against the same ref at once.
concurrency:
  # Un seul écrivain de données à la fois sur main (file d'attente FIFO).
  group: data-writers
  cancel-in-progress: false
  queue: max

jobs:
  discover:
    runs-on: ubuntu-24.04
    # Le sondage des flux prend ~15 min ; borne contre les exécutions zombies.
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      - name: Install ffmpeg (détection de silence)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Discover and validate streams
        run: |
          node scripts/discover-streams.js --update
        env:
          CI: true

      - name: Fetch now-playing metadata
        run: node scripts/fetch-radio-nowplaying.js --update

      - name: Check for changes
        id: check
        run: |
          if git diff --quiet radios.json radios-candidates.json radio-nowplaying.json; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      # Référencement : les pages d'entités, le sitemap et llms.txt dérivent
      # de ce registre. Sans cette étape, une nouvelle entrée n'aurait sa page
      # qu'à la passe hebdomadaire de maintain.yml.
      # continue-on-error : un échec du référencement ne doit jamais bloquer
      # la publication des données.
      - name: Regenerate SEO artefacts
        if: steps.check.outputs.changed == 'true'
        run: node scripts/generate-seo.js --update
        continue-on-error: true

      - name: Pre-push integrity (bot gate)
        if: steps.check.outputs.changed == 'true'
        timeout-minutes: 8
        run: bash scripts/bot-prepush-check.sh

      - name: Commit and push updates
        if: steps.check.outputs.changed == 'true'
        run: |
          git config user.name "LE-RADAR Stream Bot"
          git config user.email "actions@users.noreply.github.com"
          git add radios.json radios-candidates.json radio-nowplaying.json index.html sitemap.xml llms.txt
          git add -A radios journaux etablissements medias horaires en 2>/dev/null || true
          git commit -m "bot: update discovered streams (auto)"
          # Rebase onto any work pushed since checkout so the bot never
          # clobbers manual commits and never fails on a fast-forward race.
          bash scripts/bot-push.sh --regen "node scripts/generate-seo.js --update"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}