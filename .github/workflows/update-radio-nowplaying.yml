name: Update Radio Now Playing

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

concurrency:
  # Un seul écrivain à la fois par famille de fichiers (file FIFO) ; carte dans scripts/data-writer-groups.json.
  group: data-writers-site
  cancel-in-progress: false
  queue: max

jobs:
  fetch:
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      # Partir du main ACTUEL : en file data-writers, le sha de l'événement
      # peut dater de plusieurs passes (rebase de données impossible ensuite).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      - name: Fetch stream now-playing metadata
        run: node scripts/fetch-radio-nowplaying.js --update

      - name: Check for changes
        id: check
        run: |
          if git diff --quiet radio-nowplaying.json; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push updates
        if: steps.check.outputs.changed == 'true'
        run: |
          git config user.name "LE-RADAR Now Playing Bot"
          git config user.email "actions@users.noreply.github.com"
          git add radio-nowplaying.json
          git commit -m "bot: update radio now-playing metadata (auto)"
          bash scripts/bot-push.sh --redo "node scripts/fetch-radio-nowplaying.js --update && git add radio-nowplaying.json && { git diff --staged --quiet || git commit -qm 'bot: update radio now-playing metadata (auto)'; }"
