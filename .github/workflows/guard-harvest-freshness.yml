name: Guard Harvest Freshness

on:
  schedule:
    # Filet horaire, décalé des :20 news, */30 radio, et des passes sports.
    # GitHub lâche les crons fréquents : ce job relance une récolte si l’âge
    # dépasse le SLA (voir scripts/harvest-freshness-lib.js).
    - cron: '10 * * * *'
  workflow_dispatch:

concurrency:
  # Un seul écrivain à la fois par famille de fichiers (file FIFO) ; carte dans scripts/data-writer-groups.json.
  group: data-writers-site
  cancel-in-progress: false
  queue: max

jobs:
  guard:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      actions: write

    steps:
      # Partir du main ACTUEL : en file data-writers, le sha de l'événement
      # peut dater de plusieurs passes (rebase de données impossible ensuite).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      - name: Setup Python (sidecar Spordle TLS)
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Install curl_cffi
        run: pip install --quiet 'curl_cffi>=0.7'
        continue-on-error: true

      - name: Evaluate harvest freshness
        id: eval
        run: node scripts/guard-harvest-freshness.js --github-output

      - name: Rediscover RSEQ leagues
        if: steps.eval.outputs.leagues == 'true'
        run: node scripts/discover-sports.js --update

      - name: Catch-up RSEQ sports
        if: steps.eval.outputs.sports == 'true'
        run: node scripts/fetch-sports.js --update
        env:
          HOCKEY_CACHE_URL: https://le-radar-hockey.azdak.workers.dev

      - name: Refresh /sports/ HTML from sports.json
        if: steps.eval.outputs.sports == 'true' || steps.eval.outputs.sports_html == 'true'
        timeout-minutes: 3
        run: node scripts/generate-seo.js --update --sports-only
        env:
          CI: true

      - name: Catch-up radio now-playing
        if: steps.eval.outputs.radio == 'true'
        run: node scripts/fetch-radio-nowplaying.js --update

      - name: Catch-up news feeds (relance Update Student News)
        if: steps.eval.outputs.news == 'true'
        run: |
          # Seul Update Student News écrit news.json, l'archive, feed.xml et le
          # SEO (lot D) : on le relance au lieu de récolter ici.
          gh workflow run update-news.yml --ref main -R "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Validate generated HTML
        run: |
          git add sports/index.html en/sports/index.html
          if ! git diff --staged --quiet -- '*.html'; then
            bash scripts/bot-prepush-check.sh
          fi

      - name: Commit catch-up
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Un chemin absent ne doit pas faire sauter tout le `git add`.
          for p in sports.json sports-masthead.json sports-leagues.json sports-teams.json sports-sailing.json \
            sports/index.html en/sports/index.html radio-nowplaying.json; do
            if [ -e "$p" ]; then git add -- "$p"; fi
          done
          if git diff --staged --quiet; then
            echo "Harvest already within SLA (or catch-up produced an identical payload)."
            exit 0
          fi
          git commit -m "chore(ops): harvest freshness catch-up"
          bash scripts/bot-push.sh --regen "node scripts/generate-seo.js --update --sports-only"
