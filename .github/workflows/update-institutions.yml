name: Update Institutions Catalogue

on:
  schedule:
    # Three times a year, aligned with the academic terms (winter / summer /
    # fall): the 5th of January, May and September at 06:00 UTC.
    - cron: '0 6 5 1,5,9 *'
  workflow_dispatch:   # Allow manual trigger

concurrency:
  # Un seul écrivain à la fois par famille de fichiers (file FIFO) ; carte dans scripts/data-writer-groups.json.
  group: data-writers-site
  cancel-in-progress: false
  queue: max

jobs:
  catalogue:
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      # Partir du main ACTUEL : en file data-writers, le sha de l'événement
      # peut dater de plusieurs passes (rebase de données impossible ensuite).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      - name: Refresh the Québec higher-ed institutions catalogue (Wikidata)
        run: node scripts/update-institutions.js --update
        env:
          CI: true

      - name: Check for changes
        id: check
        run: |
          if git diff --quiet institutions.json; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      # Référencement : les pages d'entités, le sitemap et llms.txt dérivent
      # de ce registre. Sans cette étape, une nouvelle entrée n'aurait sa page
      # qu'à la passe hebdomadaire de maintain.yml.
      # continue-on-error : un échec du référencement ne doit jamais bloquer
      # la publication des données.
      - name: Regenerate SEO artefacts
        if: steps.check.outputs.changed == 'true'
        run: node scripts/generate-seo.js --update
        continue-on-error: true

      - name: Pre-push integrity (bot gate)
        if: steps.check.outputs.changed == 'true'
        timeout-minutes: 8
        run: bash scripts/bot-prepush-check.sh

      - name: Commit and push updates
        if: steps.check.outputs.changed == 'true'
        run: |
          git config user.name "LE-RADAR Institutions Bot"
          git config user.email "actions@users.noreply.github.com"
          git add institutions.json index.html sitemap.xml llms.txt
          for p in radios journaux etablissements medias horaires en; do if [ -e "$p" ]; then git add -A -- "$p"; fi; done
          git commit -m "bot: refresh higher-ed institutions catalogue (auto)"
          bash scripts/bot-push.sh --regen "node scripts/generate-seo.js --update"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
