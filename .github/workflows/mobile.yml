name: Mobile

on:
  pull_request:
    paths:
      - 'mobile/**'
      - 'android/**'
      - 'ios/**'
      - 'article/**'
      - 'capacitor.config.json'
      - 'package.json'
      - 'package-lock.json'
      - 'tests/mobile-*'
      - '.github/workflows/mobile.yml'
      - '.github/workflows/mobile-release.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: platforms;android-36 build-tools;36.0.0 platform-tools

      - name: Install
        run: npm ci

      - name: Debug APK
        run: npm run android:debug

      - name: Release AAB with a throwaway upload key
        run: |
          keytool -genkeypair \
            -keystore "$RUNNER_TEMP/ci-upload.keystore" \
            -storepass ci-only -keypass ci-only -alias ci \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=LE-RADAR CI, OU=CI, O=LE-RADAR, L=Montreal, ST=QC, C=CA"
          cat > android/keystore.properties <<EOF
          storeFile=$RUNNER_TEMP/ci-upload.keystore
          storePassword=ci-only
          keyAlias=ci
          keyPassword=ci-only
          EOF
          cd android && ./gradlew bundleRelease

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android-outputs
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error

  ios:
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm

      - name: Install and sync
        run: npm ci && npm run mobile:sync

      - name: Unsigned iOS compile
        run: >
          xcodebuild
          -project ios/App/App.xcodeproj
          -scheme App
          -configuration Release
          -destination 'generic/platform=iOS'
          CODE_SIGNING_ALLOWED=NO
          CODE_SIGNING_REQUIRED=NO
          build
