name: Update Student News

on:
  schedule:
    # Passes *affichées* (Québec, EDT) : 6 h + midi + toutes les 2 h 7 h–21 h.
    #   06:00 07:00 09:00 11:00 12:00 13:00 15:00 17:00 19:00 21:00
    # Cron 35 min plus tôt (UTC) : GitHub retarde 20–40 min + fetch ~10 min.
    #   06:00 QC → 09:25 UTC | 07:00 → 10:25 | 09:00 → 12:25 | 11:00 → 14:25
    #   12:00 QC → 15:25 UTC | 13:00 → 16:25 | 15:00 → 18:25 | 17:00 → 20:25
    #   19:00 QC → 22:25 UTC | 21:00 → 00:25
    #
    # Filet : toutes les heures à :20 — seulement si la dernière mise à jour
    # a plus de 75 min (compense un créneau sauté ou un gate qui a échoué).
    - cron: '25 0,9,10,12,14,15,16,18,20,22 * * *'
    - cron: '20 * * * *'
  workflow_dispatch:   # Allow manual trigger

# Un seul job cron à la fois. Une passe *manuelle* a son propre groupe :
# le filet :20 ne doit pas l’annuler (sinon le tampon prod ne bouge pas).
concurrency:
  group: update-news-${{ github.event_name == 'workflow_dispatch' && 'manual' || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  aggregate:
    runs-on: ubuntu-latest
    # 25 min suffit avec plafonds par source ; 45 min laissait un hang McGill
    # Daily bloquer toute l'après-midi.
    timeout-minutes: 25
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          # Node 20 déprécié sur les runners GitHub Actions (forçage vers 24).
          node-version: '24'

      # github.event.schedule = expression cron exacte qui a déclenché le run.
      # Filet :20 — skip si un refresh a déjà eu lieu récemment.
      - name: Safety-net gate
        id: gate
        run: |
          SCHEDULE='${{ github.event.schedule }}'
          echo "schedule=$SCHEDULE"
          if [ "$SCHEDULE" != "20 * * * *" ]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "Primary or manual schedule — always run."
            exit 0
          fi
          AGE_MIN=$(node -e "
            const fs = require('fs');
            let updated = 0;
            try {
              const n = JSON.parse(fs.readFileSync('news.json', 'utf8'));
              updated = Date.parse(n.updated || 0) || 0;
            } catch { /* missing */ }
            console.log(Math.floor((Date.now() - updated) / 60000));
          ")
          echo "minutes_since_update=$AGE_MIN"
          if [ "$AGE_MIN" -lt 75 ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Safety net: last update ${AGE_MIN}m ago (< 75m) — skip."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "Safety net: last update ${AGE_MIN}m ago — run catch-up."
          fi

      # Chaque étape a un plafond : un script qui se fige n'empêche pas
      # d'écrire au moins news.json si fetch-news a réussi.
      - name: Fetch news feeds
        id: fetch
        if: steps.gate.outputs.skip != 'true'
        # Sources ~15s + enrich plafonné ~90s ; 12 min laissait un hang regex
        # tuer tout le job. Filet 10 min suffisant avec plafonds CI.
        timeout-minutes: 10
        run: node scripts/fetch-news.js --update
        env:
          CI: true
          FIREBASE_POLYSCOPE_API_KEY: ${{ secrets.FIREBASE_POLYSCOPE_API_KEY }}
        continue-on-error: false

      - name: Verify authors
        if: steps.gate.outputs.skip != 'true' && steps.fetch.outcome == 'success'
        timeout-minutes: 5
        run: node scripts/verify-authors.js --update
        env:
          CI: true
        continue-on-error: true

      - name: Enrich lead excerpts
        if: steps.gate.outputs.skip != 'true' && steps.fetch.outcome == 'success'
        timeout-minutes: 4
        run: node scripts/enrich-lead-excerpts.js --update
        env:
          CI: true
        continue-on-error: true

      - name: Ensure lead images
        if: steps.gate.outputs.skip != 'true' && steps.fetch.outcome == 'success'
        timeout-minutes: 6
        run: node scripts/ensure-lead-images.js --update
        env:
          CI: true
        continue-on-error: true

      # Miroir local des photos source (GitHub Pages) — si un journal tombe
      # (ex. L’Exemplaire), le fil garde les images déjà cachées. Hôtes fragiles
      # : repli Wayback au téléchargement.
      - name: Mirror source images
        if: steps.gate.outputs.skip != 'true' && steps.fetch.outcome == 'success'
        timeout-minutes: 8
        run: node scripts/mirror-news-images.js --update
        env:
          CI: true
        continue-on-error: true

      - name: Verify photo credits
        if: steps.gate.outputs.skip != 'true' && steps.fetch.outcome == 'success'
        timeout-minutes: 5
        run: node scripts/verify-photo-credits.js --update
        env:
          CI: true
        continue-on-error: true

      - name: Fetch social + generate RSS
        if: steps.gate.outputs.skip != 'true' && steps.fetch.outcome == 'success'
        timeout-minutes: 4
        run: |
          node scripts/fetch-social.js --update
          node scripts/generate-feed.js --update
        env:
          CI: true
        continue-on-error: true

      # Éviter un commit Git à chaque simple rafraîchissement de timestamps.
      # Les changements éditoriaux sont poussés immédiatement; en l'absence de
      # changement réel, un heartbeat reste publié au plus toutes les 6 h.
      - name: Check for changes
        id: check
        if: steps.gate.outputs.skip != 'true' && steps.fetch.outcome == 'success'
        run: |
          # Passe manuelle : toujours publier pour que le tampon « mis à jour »
          # de le-radar.ca avance, même sans nouvel article.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Manual dispatch — always publish so the live stamp moves."
            exit 0
          fi
          FILES=(news.json news-archive.json author-qc.json lead-excerpt-qc.json social-feed.json lead-image-qc.json photo-credit-qc.json feed.xml news-sources.json assets/news-images)
          if ! git diff --quiet \
            -I '^[[:space:]]*"updated(Slot|At)?"[[:space:]]*:' \
            -I '^[[:space:]]*"lastFetchOk"[[:space:]]*:' \
            -I '^[[:space:]]*"[^" ]*(CheckedAt|checkedAt|FetchedAt|fetchedAt)"[[:space:]]*:' \
            -I '^[[:space:]]*<lastBuildDate>' \
            -- "${FILES[@]}"; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Meaningful content or QC change — publish now."
            exit 0
          fi

          COMMITTED_AGE_MIN=$(git show HEAD:news.json | node -e "
            let raw = '';
            process.stdin.on('data', c => raw += c);
            process.stdin.on('end', () => {
              try {
                const updated = Date.parse(JSON.parse(raw).updated || 0) || 0;
                console.log(Math.floor((Date.now() - updated) / 60000));
              } catch { console.log(9999); }
            });
          ")
          echo "minutes_since_committed_heartbeat=$COMMITTED_AGE_MIN"
          if [ "$COMMITTED_AGE_MIN" -ge 360 ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Timestamp-only heartbeat due (>= 6 h)."
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Timestamp-only refresh — skip noisy commit."
          fi

      # Référencement : prérendu du fil dans index.html (les robots des IA
      # n'exécutent pas JS) + sitemap + llms.txt. Volontairement APRÈS le
      # contrôle de changement : sinon index.html bougerait à chaque passe et
      # forcerait un commit, ce que la logique anti-bruit ci-dessus évite.
      # continue-on-error : un échec ici ne doit jamais bloquer la publication
      # éditoriale.
      - name: Regenerate SEO artefacts
        if: steps.gate.outputs.skip != 'true' && steps.fetch.outcome == 'success' && steps.check.outputs.changed == 'true'
        timeout-minutes: 2
        run: node scripts/generate-seo.js --update
        env:
          CI: true
        continue-on-error: true

      # Gate locale avant push HTML : évite un Vérification rouge (mail) si
      # generate-seo / données ont cassé l’intégrité statique.
      # continue-on-error : un test figé (date d’article sortie de la fiche)
      # ne doit plus retenir news.json — le fil JS lit ce fichier.
      - name: Pre-push integrity (bot gate)
        id: prepush
        if: steps.gate.outputs.skip != 'true' && steps.fetch.outcome == 'success' && steps.check.outputs.changed == 'true'
        timeout-minutes: 8
        continue-on-error: true
        run: bash scripts/bot-prepush-check.sh

      - name: Commit and push updates
        if: steps.gate.outputs.skip != 'true' && steps.fetch.outcome == 'success' && steps.check.outputs.changed == 'true'
        run: |
          git config user.name "LE-RADAR News Bot"
          git config user.email "actions@users.noreply.github.com"
          DATA_FILES=(
            news.json news-archive.json historical-catalog.config.json
            author-qc.json lead-excerpt-qc.json social-feed.json
            lead-image-qc.json photo-credit-qc.json feed.xml
            news-sources.json assets/news-images
          )
          if [ "${{ steps.prepush.outcome }}" = "success" ]; then
            git add "${DATA_FILES[@]}" index.html sitemap.xml sitemap-archives.xml llms.txt 2>/dev/null || true
            # Pages d'entités : dossiers entièrement régénérés. `-A` est
            # indispensable — sans lui, une fiche retirée resterait en ligne.
            git add -A radios journaux etablissements medias horaires en archives 2>/dev/null || true
            MSG='bot: update student news feed, excerpts, images, photo credits, RSS and social (auto)'
          else
            echo "::warning::integrity check failed — publishing news data only so the live feed still updates"
            git add "${DATA_FILES[@]}" 2>/dev/null || true
            MSG='bot: update student news feed (auto; HTML gate deferred)'
          fi
          git commit -m "$MSG" || exit 0
          for i in 1 2 3; do
            git pull --rebase -X theirs --autostash origin "${GITHUB_REF_NAME}" && git push && exit 0
            git rebase --abort 2>/dev/null || true
            echo "push attempt $i failed, retrying…"
            sleep $((i * 3))
          done
          echo "::error::could not push bot update after retries"
          exit 1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
