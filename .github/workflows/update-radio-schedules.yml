name: Update Radio Schedules

on:
  schedule:
    # Hebdomadaire (lundi 09:00 UTC). Mesuré sur l'historique de
    # radio-schedules.json : entre deux passes espacées de huit jours, trois à
    # cinq stations changeaient réellement de contenu (CKUT « Dykes on Mykes »
    # → « Lesbo-sons », spéciales festival à CISM…). Les grilles portent des
    # occurrences propres à la semaine, pas une grille type : à la quinzaine on
    # se trompait une semaine sur deux pour les émissions en alternance.
    - cron: '0 9 * * 1'
    # Rentrées (janvier, août, septembre) : les grilles sont refaites au
    # complet, on repasse le jeudi en plus du lundi.
    - cron: '0 9 * 1,8,9 4'
  workflow_dispatch:

concurrency:
  group: update-radio-schedules-${{ github.ref }}
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - name: Discover and revalidate schedule sources
        run: node scripts/discover-schedule-sources.js --update

      - name: Collate station schedules
        run: node scripts/fetch-radio-schedules.js --update

      - name: Check for changes
        id: check
        run: |
          if git diff --quiet radio-schedules.json radio-schedules.seed.json; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      # Référencement : les pages d'entités, le sitemap et llms.txt dérivent
      # de ce registre. Sans cette étape, une nouvelle entrée n'aurait sa page
      # qu'à la passe hebdomadaire de maintain.yml.
      # continue-on-error : un échec du référencement ne doit jamais bloquer
      # la publication des données.
      - name: Regenerate SEO artefacts
        if: steps.check.outputs.changed == 'true'
        run: node scripts/generate-seo.js --update
        continue-on-error: true

      - name: Pre-push integrity (bot gate)
        if: steps.check.outputs.changed == 'true'
        timeout-minutes: 8
        run: bash scripts/bot-prepush-check.sh

      - name: Commit and push updates
        if: steps.check.outputs.changed == 'true'
        run: |
          git config user.name "LE-RADAR Schedule Bot"
          git config user.email "actions@users.noreply.github.com"
          git add radio-schedules.json radio-schedules.seed.json index.html sitemap.xml llms.txt
          git add -A radios journaux etablissements medias horaires en 2>/dev/null || true
          git commit -m "bot: update radio schedules + sources (auto)"
          # Fichiers générés : en cas de conflit avec un commit concurrent,
          # -X theirs garde la version fraîchement produite par ce bot, et un
          # rebase interrompu est abandonné avant la tentative suivante —
          # sinon les retries échouent tous sur « unmerged files ».
          for i in 1 2 3; do
            git pull --rebase -X theirs --autostash origin "${GITHUB_REF_NAME}" && git push && exit 0
            git rebase --abort 2>/dev/null || true
            echo "push attempt $i failed, retrying…"
            sleep $((i * 3))
          done
          echo "::error::could not push schedule update after retries"
          exit 1
