name: Update Radio Schedules

on:
  schedule:
    # Quotidien 09:00 UTC. Les grilles portent des occurrences de la semaine,
    # pas un gabarit type : CHOQ publie des épisodes datés en cours de semaine
    # (Pôle hip-hop le dimanche n’existait pas encore à la passe du jeudi).
    # Les autres postes no-op s’il n’y a rien de nouveau (pas de commit).
    - cron: '0 9 * * *'
  workflow_dispatch:

concurrency:
  # Un seul écrivain de données à la fois sur main (file d'attente FIFO).
  group: data-writers
  cancel-in-progress: false
  queue: max

jobs:
  fetch:
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      - name: Discover and revalidate schedule sources
        run: node scripts/discover-schedule-sources.js --update

      - name: Collate station schedules
        run: node scripts/fetch-radio-schedules.js --update

      # Toujours régénérer le SEO : le libellé « Semaine du … » est la semaine
      # Québec courante (seo-pages-lib), pas un champ du JSON. Sans cette
      # passe le lundi, les pages restent à la semaine précédente et
      # static-integrity (via bot-prepush) fait échouer RSEQ / autres bots.
      # continue-on-error : un échec du référencement ne doit jamais bloquer
      # la publication des données de grille.
      - name: Regenerate SEO artefacts
        run: node scripts/generate-seo.js --update
        continue-on-error: true

      - name: Check for changes
        id: check
        run: |
          if git diff --quiet -- radio-schedules.json radio-schedules.seed.json index.html sitemap.xml llms.txt radios journaux etablissements medias horaires en; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Pre-push integrity (bot gate)
        if: steps.check.outputs.changed == 'true'
        timeout-minutes: 8
        run: bash scripts/bot-prepush-check.sh

      - name: Commit and push updates
        if: steps.check.outputs.changed == 'true'
        run: |
          git config user.name "LE-RADAR Schedule Bot"
          git config user.email "actions@users.noreply.github.com"
          git add radio-schedules.json radio-schedules.seed.json index.html sitemap.xml llms.txt
          git add -A radios journaux etablissements medias horaires en 2>/dev/null || true
          git commit -m "bot: update radio schedules + sources (auto)"
          bash scripts/bot-push.sh --regen "node scripts/generate-seo.js --update"
