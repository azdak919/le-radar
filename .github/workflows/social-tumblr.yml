name: Social — Tumblr (le-radar-ca.tumblr.com)

# Articles frais du flux (≤ 24 h, après la mise en service), plafond de base 5/h et 50/24 h, modulé par data/social/posting-windows.json et le rodage
# (scripts/social/rate-limit.mjs), sélection comme X au-delà. Coût : 0 $.
# Publication réelle seulement si la variable de dépôt TUMBLR_LIVE vaut « true »
# (les règles de Tumblr encadrent la publication automatisée : activation sur accord).
# Idempotent : data/tumblr-sent.json + derniers posts du blogue.
on:
  schedule:
    - cron: '20,50 11-23,0-3 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Essai : vérifie l’authentification (/v2/user/info), aucune publication'
        type: boolean
        default: true
      share_now:
        description: 'Publier tout de suite UN article frais (après la mise en service)'
        type: boolean
        default: false
      share_url:
        description: 'Avec share_now : URL de l’article précis à publier (même article sur tous les réseaux)'
        type: string
        default: ''

permissions:
  contents: write

concurrency:
  group: data-writers-social
  cancel-in-progress: false
  queue: max

jobs:
  post:
    if: github.event_name == 'workflow_dispatch' || vars.TUMBLR_LIVE == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Publier les articles frais
        env:
          TUMBLR_CONSUMER_KEY: ${{ secrets.TUMBLR_CONSUMER_KEY }}
          TUMBLR_CONSUMER_SECRET: ${{ secrets.TUMBLR_CONSUMER_SECRET }}
          TUMBLR_TOKEN: ${{ secrets.TUMBLR_TOKEN }}
          TUMBLR_TOKEN_SECRET: ${{ secrets.TUMBLR_TOKEN_SECRET }}
          DRY_RUN: ${{ (inputs.dry_run || vars.TUMBLR_LIVE != 'true') && 'true' || 'false' }}
          SHARE_NOW: ${{ inputs.share_now && 'true' || 'false' }}
          SHARE_URL: ${{ inputs.share_url }}
          CLOUDFLARE_AI_TOKEN: ${{ secrets.CLOUDFLARE_AI_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/social/tumblr-post.mjs
      - name: Commit de l'état (data/tumblr-sent.json seulement)
        if: always()
        run: |
          git diff --quiet -- data/tumblr-sent.json && { echo "État inchangé."; exit 0; }
          git config user.name "Azdak"
          git config user.email "azdak-qc@proton.me"
          git add data/tumblr-sent.json
          git commit -s -m "bot(social): état des publications Tumblr"
          GITHUB_REF_NAME=main bash scripts/bot-push.sh --verify "node -e 'JSON.parse(require(\"fs\").readFileSync(\"data/tumblr-sent.json\"))'"
