name: Weekly Maintenance (full pipeline)

on:
  schedule:
    # Lundi 06:30 UTC = 2 h 30 HAE / 1 h 30 HNE : nuit de Toronto (1 h-5 h)
    # avec les deux décalages, avant les grosses passes nouvelles (09:25 UTC).
    - cron: '30 6 * * 1'
  workflow_dispatch:
    inputs:
      full_visual:
        description: "Forcer l'audit pixel et la détection de visages"
        type: boolean
        default: false

# Verrou data-writers tenu SEULEMENT par le job « publish » (quelques
# secondes) : le long job « maintain » (~25-45 min) tourne sans verrou, pour
# ne pas bloquer la file — GitHub ne garde qu'un run en attente par groupe et
# remplacerait les passes des autres bots. Une maintenance à la fois :
concurrency:
  group: maintain
  cancel-in-progress: false

jobs:
  maintain:
    runs-on: ubuntu-24.04
    # Depuis le 26 oct. 2026 : banques photo + audit + bot-status seulement
    # (~25 min mesurées avant la garde « rien à faire »). Les nouvelles, la
    # radio, les sports et les institutions ont leurs propres bots.
    # Plafond 45 min = filet zombie, pas une cible de durée.
    timeout-minutes: 45
    permissions:
      contents: read
      issues: write
    outputs:
      changed: ${{ steps.check.outputs.changed }}

    steps:
      # Partir du main ACTUEL : en file data-writers, le sha de l'événement
      # peut dater de plusieurs passes (rebase de données impossible ensuite).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      - name: Run full maintenance pipeline
        id: pipeline
        run: node scripts/maintain.js --update
        continue-on-error: true

      # Garde « rien à faire » (lot C) : les passes visuelles ne regardent que
      # les images. Sans nouvelle photo dans une banque, on ne les refait
      # qu'une fois par mois (premier lundi) ou sur demande.
      - name: Decide visual passes
        id: visual
        env:
          FULL_VISUAL: ${{ inputs.full_visual }}
        run: |
          due=false
          for f in data/quebec-backgrounds.json data/quebec-university-backgrounds.json data/quebec-pomo-backgrounds.json data/quebec-nations-backgrounds.json data/quebec-favorites-backgrounds.json; do
            if [ -n "$(git status --porcelain -- "$f")" ]; then due=true; echo "banque modifiée : $f"; fi
          done
          if [ "$(date -u +%d)" -le 7 ]; then due=true; echo "passe mensuelle"; fi
          if [ "$FULL_VISUAL" = "true" ]; then due=true; echo "forcé"; fi
          echo "due=$due" >> "$GITHUB_OUTPUT"

      # Passes visuelles des banques photo (saisons, visages). Sans elles le
      # pipeline tourne quand même : les scripts Python sortent en 2 et les
      # portes Node lisent les annotations déjà persistées. On les installe pour
      # que le bot annote les NOUVELLES photos, sinon un visage n'est jamais
      # mesuré avant d'atterrir en banque.
      - name: Setup Python (analyse d'image des banques)
        if: steps.visual.outputs.due == 'true'
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'

      - name: Install image deps
        if: steps.visual.outputs.due == 'true'
        # OpenCV 5 a retiré les cascades de Haar (cv2.CascadeClassifier) :
        # la borne majeure est fonctionnelle, pas cosmétique.
        run: pip install --quiet "opencv-python-headless<5" Pillow
        continue-on-error: true

      - name: Detect faces in photo banks
        if: steps.visual.outputs.due == 'true'
        run: node scripts/detect-photo-faces.js --update --sync
        continue-on-error: true

      # Audit pixel — le seul contrôle qui REGARDE les images. Rapport seulement.
      - name: Quebec photo bank pixel audit (report)
        if: steps.visual.outputs.due == 'true'
        run: python3 scripts/audit-quebec-backgrounds.py --width 900 --delay 0.5 || true

      # maintain.js écrit les JSON des banques et s'arrête. Les *-data.js
      # sont la copie que le site charge, et ce sont des assets du shell SW.
      # Sans sync + bump, bot-prepush échoue (URL absente, ou cache pas bumpé).
      # bank:sync réécrit aussi photo-bank-data.js. Le bump empreinte ce
      # fichier : le commit doit l'embarquer avec data/photo-bank.json, sinon
      # le verrou vise un hash absent de main et les bots suivants ne publient plus.
      - name: Sync photo bank mirrors
        run: |
          dirty=false
          for f in data/quebec-backgrounds.json data/quebec-university-backgrounds.json data/quebec-pomo-backgrounds.json data/quebec-nations-backgrounds.json data/quebec-favorites-backgrounds.json; do
            if [ -n "$(git status --porcelain -- "$f")" ]; then dirty=true; fi
          done
          if [ "$dirty" = true ]; then
            npm run bank:sync
            npm run sw:bump
          fi

      - name: Check for file changes
        id: check
        run: |
          CHANGED=false
          for f in bot-status.json data/photo-bank.json data/quebec-backgrounds.json data/quebec-university-backgrounds.json data/quebec-pomo-backgrounds.json data/quebec-nations-backgrounds.json data/quebec-favorites-backgrounds.json photo-bank-data.js quebec-backgrounds-data.js quebec-university-backgrounds-data.js quebec-pomo-backgrounds-data.js quebec-nations-backgrounds-data.js quebec-favorites-backgrounds-data.js sw.js pomo/sw.js solitaire/sw.js sports/sw.js sw-shell-lock.json; do
            # git status voit aussi les fichiers pas encore suivis (bot-status.json
            # à sa première écriture), contrairement à git diff.
            if [ -n "$(git status --porcelain -- "$f")" ]; then
              CHANGED=true
              echo "changed: $f"
            fi
          done
          echo "changed=$CHANGED" >> $GITHUB_OUTPUT

      - name: Pre-push integrity (bot gate)
        if: steps.check.outputs.changed == 'true'
        timeout-minutes: 8
        run: bash scripts/bot-prepush-check.sh

      - name: Commit and push bot updates
        if: steps.check.outputs.changed == 'true'
        run: |
          git config user.name "LE-RADAR Maintenance Bot"
          git config user.email "actions@users.noreply.github.com"
          # N'ajouter que les chemins présents : si le pipeline a échoué avant
          # d'écrire bot-status.json, git add sur un chemin absent est fatal et
          # les données déjà produites ne sont jamais poussées.
          #
          # `-e` et non `-f` : la liste contient aussi les DOSSIERS de pages
          # d'entités, que `-f` (fichier régulier) rejetterait silencieusement.
          # `git add -A` pour que la suppression d'une page soit stagée.
          for f in bot-status.json data/photo-bank.json data/quebec-backgrounds.json data/quebec-university-backgrounds.json data/quebec-pomo-backgrounds.json data/quebec-nations-backgrounds.json data/quebec-favorites-backgrounds.json photo-bank-data.js quebec-backgrounds-data.js quebec-university-backgrounds-data.js quebec-pomo-backgrounds-data.js quebec-nations-backgrounds-data.js quebec-favorites-backgrounds-data.js sw.js pomo/sw.js solitaire/sw.js sports/sw.js sw-shell-lock.json; do
            [ -e "$f" ] && git add -A "$f"
          done
          git commit -m "bot: weekly maintenance run (auto)"
          # Publication déléguée au job « publish » (seul à tenir data-writers).
          git bundle create maintain.bundle "HEAD^..HEAD"

      - name: Hand commit to publish job
        if: steps.check.outputs.changed == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: maintain-commit
          path: maintain.bundle
          retention-days: 1

      - name: Open GitHub issue when human attention needed
        if: steps.pipeline.outcome != 'success' && steps.pipeline.outcome != 'skipped'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # bot-status.json peut manquer si le pipeline a planté avant de
          # l'écrire — ouvrir quand même une issue minimale plutôt qu'échouer.
          if [ ! -f bot-status.json ]; then
            BODY="Le bot de maintenance hebdomadaire a échoué avant d'écrire bot-status.json — consulter les logs du run."
          else
          BODY=$(node -e "
            const s = require('./bot-status.json');
            const alerts = (s.alerts || []).map(a => '- [' + a.level + '] ' + a.message).join('\n');
            console.log('Le bot de maintenance hebdomadaire signale des points à vérifier.\n\n'
              + '**Résumé**\n'
              + '- Articles : ' + s.summary.news.articles + ' (' + s.summary.news.active + ' flux actifs)\n'
              + '- Radios avec flux : ' + s.summary.radios.withStream + '/' + s.summary.radios.listed + '\n'
              + '- Couverture journaux (univ.) : ' + s.summary.coverage.universitiesWithNews + '/' + s.summary.coverage.universitiesTotal + '\n\n'
              + '**Alertes**\n' + (alerts || '_aucune_'));
          ")
          fi
          gh issue list --repo "${{ github.repository }}" --search "in:title LE-RADAR maintenance alert" --state open --json number --jq 'length' | {
            read OPEN
            if [ "$OPEN" -gt 0 ]; then
              echo "An open maintenance issue already exists — skipping."
              exit 0
            fi
            gh issue create \
              --repo "${{ github.repository }}" \
              --title "LE-RADAR maintenance alert — vérification humaine suggérée" \
              --body "$BODY"
          }

  publish:
    needs: maintain
    if: needs.maintain.outputs.changed == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      # Un seul écrivain de données à la fois sur main (file FIFO), le temps du push.
      group: data-writers-maintenance
      cancel-in-progress: false
      queue: max
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: maintain-commit
      - name: Push maintenance commit
        run: |
          git config user.name "LE-RADAR Maintenance Bot"
          git config user.email "actions@users.noreply.github.com"
          git fetch -q maintain.bundle HEAD:refs/maint
          rm -f maintain.bundle
          git checkout -q refs/maint
          # bot-push.sh rebase sur le main actuel et réessaie.
          GITHUB_REF_NAME=main bash scripts/bot-push.sh
