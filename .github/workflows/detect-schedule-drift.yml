name: Detect Radio Schedule Drift

on:
  schedule:
    # Quotidien, en soirée Québec (23:10 UTC ≈ 19:10 HAE) : c'est la tranche où
    # les stations sortent de leur grille — matchs, spéciales, remplacements.
    # La collecte de grilles, elle, reste aux deux semaines : ce bot ne réécrit
    # jamais radio-schedules.json, il ne fait que constater l'écart.
    - cron: '10 23 * * *'
  workflow_dispatch:

concurrency:
  # Un seul écrivain de données à la fois sur main (file d'attente FIFO).
  group: data-writers
  cancel-in-progress: false
  queue: max

jobs:
  detect:
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      # Partir du main ACTUEL : en file data-writers, le sha de l'événement
      # peut dater de plusieurs passes (rebase de données impossible ensuite).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      - name: Compare published grids against live schedule pages
        run: node scripts/detect-schedule-drift.js --update

      - name: Check for changes
        id: check
        run: |
          if git diff --quiet radio-schedule-drift.json; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push report
        if: steps.check.outputs.changed == 'true'
        run: |
          git config user.name "LE-RADAR Schedule Drift Bot"
          git config user.email "actions@users.noreply.github.com"
          git add radio-schedule-drift.json
          git commit -m "bot: report radio schedule drift (auto)"
          bash scripts/bot-push.sh
