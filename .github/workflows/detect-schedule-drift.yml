name: Detect Radio Schedule Drift

on:
  schedule:
    # Quotidien, en soirée Québec (23:10 UTC ≈ 19:10 HAE) : c'est la tranche où
    # les stations sortent de leur grille — matchs, spéciales, remplacements.
    # La collecte de grilles, elle, reste aux deux semaines : ce bot ne réécrit
    # jamais radio-schedules.json, il ne fait que constater l'écart.
    - cron: '10 23 * * *'
  workflow_dispatch:

concurrency:
  group: detect-schedule-drift-${{ github.ref }}
  cancel-in-progress: false

jobs:
  detect:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - name: Compare published grids against live schedule pages
        run: node scripts/detect-schedule-drift.js --update

      - name: Check for changes
        id: check
        run: |
          if git diff --quiet radio-schedule-drift.json; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push report
        if: steps.check.outputs.changed == 'true'
        run: |
          git config user.name "LE-RADAR Schedule Drift Bot"
          git config user.email "actions@users.noreply.github.com"
          git add radio-schedule-drift.json
          git commit -m "bot: report radio schedule drift (auto)"
          # Fichier généré : en cas de conflit avec un commit concurrent,
          # -X theirs garde la version fraîchement produite par ce bot, et un
          # rebase interrompu est abandonné avant la tentative suivante.
          for i in 1 2 3; do
            git pull --rebase -X theirs --autostash origin "${GITHUB_REF_NAME}" && git push && exit 0
            git rebase --abort 2>/dev/null || true
            echo "push attempt $i failed, retrying…"
            sleep $((i * 3))
          done
          echo "::error::could not push schedule drift report after retries"
          exit 1
